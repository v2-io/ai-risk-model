<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title_text}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
{{style}}
</head>
<body>
<main class="page">

  <header class="masthead">
    <div class="kicker"><span>{{kicker_left}}</span><span>{{kicker_right}}</span></div>
    <h1>{{title}}</h1>
    {{intro}}
  </header>

  <!-- The map: actor table | connector gutter | the agent's stack.
       --ncols = number of displayed columns after the first. -->
  <section class="map" style="--ncols: {{ncols}}">
    <div class="thead">{{head}}</div>
    <div class="stack-label">{{stack_label}}</div>

    <div class="actors">
{{rows}}
    </div>
    <svg class="edges" aria-hidden="true"></svg>
    <div class="stack">
{{stack}}
    </div>

    <div class="referents">
{{referents}}
    </div>

    <div class="notes">{{notes}}</div>
    <div class="footnotes">{{footnote}}</div>
  </section>

</main>
{{script}}
</body>
</html>
