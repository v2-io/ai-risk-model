# ======================================================= size vs rate (added 2026-09-27, on Joseph's question)
# Rate raises volatility immediately. Size dampens it only through routinization, which lags.
# Growing fast means size (and its coordination costs) arrives before routines do: H2's "large and fluid" regime.
- id: r-growth-size
  from: org-growth-rate
  to: org-size
  type: influences
  sign: "+"
  note: Flow into stock (accumulation). Definitional in system-dynamics terms.
  claims:
    - {author: "integrator (Claude)", channel: dialog, evidence: definition, qualifier: "stock-and-flow identity"}

- id: r-size-routinization
  from: org-size
  to: routinization
  type: influences
  sign: "+"
  delay: long
  claims:
    - {author: "Hannan & Freeman (1984)", channel: "carried over [C] in prior agent report (influx/safety-and-hypergrowth.md, Theoretical grounding)", evidence: measurement, qualifier: "structural inertia theory; not re-fetched", quote: "inertia grows with size and age"}
    - {author: "prior Claude agent (report for Joseph)", channel: "prior agent report (influx/safety-and-hypergrowth.md)", evidence: argument, qualifier: "hypothesis H2, rated 50–65%", quote: "the inertia that would dampen change lags beyond the 6-month window"}

