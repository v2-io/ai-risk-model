# Relations between concepts, each carried by one or more CLAIMS.
# type: influences (sign + / - / ? ; "+?" = direction asserted, weakly) | moderates (acts on other relations: `targets`)
#       | indicates (observable measure of a concept) | part_of (definitional, not causal)
# No magnitudes: signs only, unless a source quantifies (then in the claim's quote).
# Claim fields (provenance in three layers plus a qualifier):
#   author    who asserts it
#   channel   how it reached us: primary · press · secondary summary · "relay: <verification file>" · prior agent report · dialog
#   evidence  what backs it: none-stated · argument · expert-judgment · measurement · incident · definition · established-practice
#   qualifier the source's own hedge or status, verbatim or close: "may", "Highly likely (PHIA)", "hypothesis H1", "proposal", …
#   doc (relata key or file), loc, quote
# A relation's standing is READ OFF its claims (how many, how independent, what evidence). It is never stored as a number.

# ======================================================= context and the recursive R&D loop
- id: r-race-pace
  from: race-dynamics
  to: capability-pace
  type: influences
  sign: "+"
  claims:
    - {author: IASR 2026 writing team, channel: "relay: uk.md", evidence: argument, qualifier: "may face trade-offs", doc: bengio-2026-international, loc: "p.97", quote: "Due to competitive pressures, AI companies may face trade-offs between faster product releases and investments in risk reduction efforts."}

- id: r-race-resourcing
  from: race-dynamics
  to: safety-resourcing
  type: influences
  sign: "-"
  claims:
    - {author: IASR 2026 writing team, channel: "relay: uk.md", evidence: argument, qualifier: "can incentivise", doc: bengio-2026-international-extended, loc: "p.17", quote: "Competitive pressures can incentivise AI developers to reduce their investment in testing and risk mitigation in order to release new models quickly."}
    - {author: "CSET (Arnold & Toner)", channel: "relay: academic-ngo.md", evidence: argument, qualifier: "expected risk factor, argued from history", doc: arnold-2021-ai-accidents, loc: "p.17", quote: "Competitive pressure. When not using AI could mean falling behind competitors or losing profits, companies, militaries, and governments are more likely to deploy buggy AI systems, use them in reckless ways, or cut corners on testing and operator training."}
    - {author: "UK DSIT", channel: "relay: uk.md", evidence: argument, qualifier: "discussion paper; 'does not represent a policy position of HMG'", doc: dsit-2023-capabilities, loc: "p.19", quote: "Competition on AI has raised concern about potential \"race to the bottom\" scenarios, where actors compete to rapidly develop AI systems and under-invest in safety measures."}
    - {author: IASR 2026 writing team, channel: "relay: uk.md", evidence: argument, qualifier: "section heading; filed under market failures", doc: bengio-2026-international, loc: "p.102", quote: "Competition intensifies speed-versus-safety trade-offs."}
    - {author: Barrett et al., channel: "relay: remaining-literature.md", evidence: argument, qualifier: "may; a loss-of-control causal factor", doc: barrett-2025-stampstpa, loc: "p.19", quote: "organisations or countries may relax safety constraints to gain competitive advantages over those maintaining stronger safeguards"}
    - {author: "Uuk et al.", channel: "relay: remaining-literature.md", evidence: argument, qualifier: "could; a source of systemic risk in a rapid review (FLI-affiliated lead author)", doc: uuk-2024-taxonomy, loc: "Table 5, p.12", quote: "Competitive pressures could lead to the neglect of safety measures in AI development"}

