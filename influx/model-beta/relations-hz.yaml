- id: ihz-bio-tool-safeguards
  from: ind-bio-tool-safeguards
  to: unsafeguarded-capability-access
  type: indicates
  sign: "-"
  claims:
    - {author: IASR 2026 writing team, channel: primary, evidence: measurement, doc: bengio-2026-international, loc: "§2.1.4", quote: "only 3% of 375 biological AI tools surveyed had any form of safeguards."}

- id: ihz-disclosure-to-exploit
  from: ind-disclosure-to-exploit
  to: defender-resilience-lag
  type: indicates
  sign: "-"
  claims:
    - {author: UK NCSC, channel: primary, evidence: expert-judgment, doc: ncsc-2025-impact, loc: "PDF p.4", quote: "System owners already face a race in identifying and mitigating disclosed vulnerabilities before threat actors can exploit them."}

- id: ihz-attack-cost
  from: ind-attack-cost
  to: novice-uplift
  type: indicates
