# Security and insider-risk slice: relations (shard). IDs rs-* (relations) and is-* (indicators).
# Channel "primary" here = the integrator read the passage in the relata-attached PDF via pdftotext on 2026-09-27.
# Page numbers are printed pages (RAND-W and RAND-ISL printed = PDF − 10; AISP and Anthropic RR printed ≈ PDF).
# Structure, loops and proposals for the core: notes-security.md.

# ======================================================= what drives weight theft: the security gap
- id: rs-gap-weighttheft
  from: security-gap
  to: weight-theft
  type: influences
  sign: "+"
  claims:
    - {author: "RAND (Nevo et al.)", channel: "relay: us-security.md", evidence: definition, qualifier: "each security level is defined by the attacker class it can likely thwart; 'not meant to be used as a standard'", doc: nevo-2024-securing, loc: "Fig. 6.1, p.22", quote: "a system that can likely thwart"}
    - {author: Anthropic, channel: primary, evidence: expert-judgment, qualifier: "developer's own assessment; 'at risk of widening'", doc: anthropic-2026-risk-report-aug, loc: "App. 6.4.1, p.177", quote: "the gap between the capability level of attackers motivated to target us and attackers we can reliably defend against is at risk of widening"}

- id: rs-weightsec-gap
  from: weight-security-level
  to: security-gap
  type: influences
  sign: "-"
  claims:
    - {author: "RAND (Nevo et al.)", channel: "relay: us-security.md", evidence: definition, qualifier: "SL5 is the only level claimed against top state operations", doc: nevo-2024-securing, loc: "Fig. 6.1, p.22", quote: "could plausibly be claimed to thwart most top-priority operations by the top cyber-capable institutions (OC5)"}
    - {bears_on: "from", author: Anthropic, channel: primary, evidence: expert-judgment, qualifier: "a level, stated for the whole field", doc: anthropic-2026-risk-report-aug, loc: "§4.5.7, p.146", quote: "Security measures that are robust against nation-state-level actors are extremely difficult to implement, and we do not believe any frontier AI developer currently meets this bar; we do not either"}

- id: rs-incentive-gap
  from: theft-incentive
  to: security-gap
  type: influences
  sign: "+"
  note: Incentive recruits more capable attackers; the gap widens even if defences hold still.
  claims:
    - {author: Anthropic, channel: primary, evidence: argument, qualifier: "developer's own analysis", doc: anthropic-2026-risk-report-aug, loc: "App. 6.4.1, p.177", quote: "the sophistication of the adversaries motivated to target us is growing faster than the sophistication of the adversaries we can reliably stop"}

- id: rs-attacker-gap
  from: external-attacker-capability
  to: security-gap
  type: influences
  sign: "+"
  claims:
    - {author: IASR 2026 writing team, channel: "relay: uk.md", evidence: argument, qualifier: "research indicates; may be unable", doc: bengio-2026-international, loc: "Box 3.1, p.136", quote: "Research indicates that AI data centres may be unable to withstand attacks from the most sophisticated and well-resourced actors."}

- id: rs-pace-incentive
  from: capability-pace
  to: theft-incentive
  type: influences
  sign: "+"
  note: 'A race between timescales. Anthropic: capabilities improve faster than defences mature.'
  claims:
    - {author: Anthropic, channel: primary, evidence: argument, qualifier: "developer's own analysis; one of three trends it names", doc: anthropic-2026-risk-report-aug, loc: "App. 6.4.1, p.177", quote: "the rate at which model capabilities are improving is generally faster than the rate at which we can build and mature our defenses"}
    - {author: "RAND (Nevo et al.)", channel: primary, evidence: argument, qualifier: "could", doc: nevo-2024-securing, loc: "App. A, p.63", quote: "If specific frontier models gain strategic national security importance, one could start seeing foreign military attacks on them as well"}

- id: rs-antidistill-incentive
  from: anti-distillation-measures
  to: theft-incentive
  type: influences
  sign: "+"
  note: Displacement. Closing legitimate-access routes (distillation, ZDR, high-trust deployments) pushes determined actors toward weight theft. A good practice that raises a different risk.
  claims:
    - {author: Anthropic, channel: primary, evidence: argument, qualifier: "developer's own analysis", doc: anthropic-2026-risk-report-aug, loc: "App. 6.4.1, p.177", quote: "These dynamics increase threat actor incentives to access our models via weight theft, as other routes of gaining safeguard-free access become more difficult."}

- id: rs-buildout-infra
  from: compute-buildout-rate
  to: infrastructure-maturity-gap
  type: influences
  sign: "+"
  note: The infrastructure twin of r-growth-absorb (headcount growth → absorption gap).
  claims:
    - {author: Anthropic, channel: primary, evidence: argument, qualifier: "developer's own analysis", doc: anthropic-2026-risk-report-aug, loc: "App. 6.4.1, p.177", quote: "our attack surface is growing: we continue to bring significant new compute capacity online across multiple providers and environments, and these environments do not all begin at the same level of security maturity"}

- id: rs-infra-gap
  from: infrastructure-maturity-gap
  to: security-gap
  type: influences
  sign: "+"
  claims:
    - {author: Anthropic, channel: primary, evidence: argument, qualifier: "developer's own analysis", doc: anthropic-2026-risk-report-aug, loc: "App. 6.4.1, p.177", quote: "Raising every environment to our target baseline takes time and forces prioritization, which means that at any given point some parts of our infrastructure may be better defended than others."}

# ======================================================= what sets the security level
- id: rs-resourcing-weightsec
  from: safety-resourcing
  to: weight-security-level
  type: influences
  sign: "+"
  delay: "SL3 ~1 year; SL4 2–3 years (AISP's reading of RAND)"
  claims:
    - {author: "AISP (Gekker et al.)", channel: primary, evidence: expert-judgment, qualifier: "AISP's reading of RAND; shares authors with RAND-ISL", doc: gekker-2026-aisp, loc: "p.38", quote: "AI labs can reasonably achieve SL-3 (defending against moderately sophisticated attackers) within approximately one year and SL-4 (defending against highly sophisticated attackers) within 2-3 years through private investment."}
    - {author: Anthropic, channel: primary, evidence: argument, qualifier: "developer's expectation", doc: anthropic-2026-risk-report-aug, loc: "App. 6.4.1, p.177", quote: "we expect closing it to require sustained, prioritized investment in our security posture"}

- id: rs-state-weightsec
  from: state-security-partnership
  to: weight-security-level
  type: influences
  sign: "+"
  delay: "SL5: at least five years (AISP)"
  claims:
    - {author: "AISP (Gekker et al.)", channel: primary, evidence: expert-judgment, qualifier: "estimate", doc: gekker-2026-aisp, loc: "p.38", quote: "achieving SL-5 (defense against nation-state adversaries with billion-dollar budgets) requires an estimated minimum of five years and necessitates active support from national security communities."}
    - {author: "US White House (NSPM-11)", channel: "relay: us-gov-recent.md (mirror text)", evidence: none-stated, qualifier: "executive direction; an offer to partner, effect not measured", doc: whitehouse-2026-nspm-11, loc: "§4(c)", quote: "enhancing the physical and cyber security of our Nation's data centers"}

- id: rs-state-personnel
  from: state-security-partnership
  to: personnel-security
  type: influences
  sign: "+"
  claims:
    - {author: "US White House (NSPM-11)", channel: "relay: us-gov-recent.md (mirror text)", evidence: none-stated, qualifier: "executive direction; an offer", doc: whitehouse-2026-nspm-11, loc: "§4(c)", quote: "assisting with personnel vetting"}
    - {author: "AISP (Gekker et al.)", channel: primary, evidence: argument, qualifier: "argues commercial checks fall short of clearance-style vetting", doc: gekker-2026-aisp, loc: "p.43", quote: "Current commercial background check systems used by most technology companies are insufficient to address these threats."}

- id: rs-state-distill
  from: state-security-partnership
  to: distillation-extraction
  type: influences
  sign: "-"
  claims:
    - {author: "US White House (NSPM-11)", channel: "relay: us-gov-recent.md (mirror text)", evidence: none-stated, qualifier: "executive direction; first US-government naming of distillation as a threat (us-gov-recent.md)", doc: whitehouse-2026-nspm-11, loc: "§4(c)", quote: "to help secure America's most cutting-edge AI technologies, including from malicious distillation attacks"}

- id: rs-race-state
  from: race-dynamics
  to: state-security-partnership
  type: influences
  sign: "+"
  note: 'The race cuts both ways on security. It raises state support (this relation) and erodes company-side security (rs-race-weightsec).'
  claims:
    - {author: "US White House (America's AI Action Plan)", channel: "relay: us-gov-recent.md", evidence: argument, qualifier: "policy; the race is the plan's stated premise (p.1)", doc: whitehouse-2025-action-plan, loc: "p.12", quote: "protect AI innovations from security risks, including malicious cyber actors, insider threats, and others."}

- id: rs-race-weightsec
  from: race-dynamics
  to: weight-security-level
  type: influences
  sign: "-"
  claims:
    - {author: "Google DeepMind (FSF v3.1)", channel: "relay: company-frameworks-gdm.md", evidence: argument, qualifier: "field-contingent recommendation (self-d)", doc: gdm-2026-fsf-v3-1, loc: "p.11", quote: "we believe these recommendations will only be effective if the entire frontier AI field applies them, and of limited social utility if not."}
    - {author: "Anthropic (RSP v3.4)", channel: "relay: company-frameworks-anthropic.md", evidence: none-stated, qualifier: "RAND SL4 appears only in the industry-wide column", doc: anthropic-2026-rsp-v3-4, loc: "p.4", quote: "we cannot unilaterally and unconditionally commit to staying in line with the industry-wide recommendations"}
    - {author: "RAND (Aguirre et al., RAND-SL3)", channel: "relay: us-security.md", evidence: expert-judgment, qualifier: "workshop; 9 voters", doc: aguirre-2026-sl3, loc: "p.v", quote: "The most severe barriers to implementing AI model weight security are organizational rather than technical, including resource allocation, cross-functional coordination, and balancing security with operational velocity."}
    - {author: "CAIS (Hendrycks et al.)", channel: "relay: academic-ngo.md", evidence: argument, qualifier: "could; illustrative mechanism", doc: hendrycks-2023-overview, loc: "§6, printed p.43", quote: "a corporate AI race compels companies to prioritize the rapid development of AIs. This could increase organizational risks … a company could cut costs by putting less money toward information security, leading to one of its AI systems getting leaked"}

- id: rs-authority-mod
  from: security-authority
  type: moderates
  targets: [rs-race-weightsec]
  sign: "-"
  note: A security veto weakens the pull of speed and commercial pressure on security. It does not reduce the pressure.
  claims:
    - {author: "RAND (Nevo et al.)", channel: primary, evidence: expert-judgment, qualifier: "SL4 benchmark item", doc: nevo-2024-securing, loc: "App. B, p.90", quote: "the security team has veto (formally and in practice) over network, product, and work environment decisions that may undermine security (even if changes are important from a product or commercial perspective)"}

- id: rs-coordination-weightsec
  from: coordination-costs
  to: weight-security-level
  type: influences
  sign: "-"
  note: Joins the security slice to the core organizational cluster (size → coordination costs).
  claims:
    - {author: "RAND (Aguirre et al., RAND-SL3)", channel: "relay: us-security.md", evidence: expert-judgment, qualifier: "workshop discussion; 9 voters", doc: aguirre-2026-sl3, loc: "p.15", quote: "Fragmented ownership of systems across teams … was discussed as particularly severe in startups where personnel may have multiple roles and responsibilities."}

- id: rs-loosening-weightsec
  from: commitment-loosening
  to: weight-security-level
  type: influences
  sign: "-"
  claims:
    - {author: Anthropic, channel: primary, evidence: incident, qualifier: "developer self-report; judged not 'a meaningful difference in our overall risk posture'", doc: anthropic-2026-risk-report-aug, loc: "§4.5.8.1, p.146", quote: "since our previous Risk Report, we have set a somewhat less conservative loss threshold. We have also permitted some activations of more capable models to be stored outside these compartments in certain cases."}
    - {author: Meta, channel: "relay: company-frameworks-meta-msft-amzn.md", evidence: incident, qualifier: "documented text change, Frontier AI Framework v1.1 → v2", doc: meta-2026-advanced-ai-scaling-framework, loc: "p.15", quote: "insofar as is technically feasible and commercially practicable"}
    - {author: "Anthropic (RSP v2.2)", channel: "relay: company-frameworks-anthropic.md", evidence: incident, qualifier: "documented scope exclusion in a version change", doc: anthropic-2025-rsp-v2-2, loc: "changelog", quote: "both sophisticated insiders and state-compromised insiders from the ASL-3 Security Standard"}

- id: rs-regulation-weightsec
  from: code-commitments
  to: weight-security-level
  type: influences
  sign: "+"
  claims:
    - {author: EU GPAI Code, channel: "relay: eu.md", evidence: definition, qualifier: "committed by signatories; equivalent alternatives allowed (Measure 6.2)", doc: eu-cop-2025-safety-security, loc: "Measure 6.1", quote: "including non-state external threats, insider threats, and other expected threat actors"}

# ======================================================= the costs of security (good and bad on relations)
- id: rs-weightsec-velocity
  from: weight-security-level
  to: ai-lab-velocity
  type: influences
  sign: "-"
  claims:
    - {author: "RAND (Nevo et al.)", channel: "relay: us-security.md", evidence: expert-judgment, qualifier: "the trade-off is real and mitigable (see rs-accessmin-mod)", doc: nevo-2024-securing, loc: "p.32", quote: "The trade-off between security and productivity that this number of people points to can be significantly mitigated by implementing more constrained and secure interfaces for model weight access."}
    - {author: "Google DeepMind (FSF v3.1)", channel: "relay: company-frameworks-gdm.md", evidence: argument, qualifier: "a named consideration in choosing security levels", doc: gdm-2026-fsf-v3-1, loc: "p.15", quote: "The overall reduced impact of model weights counts against security levels with substantial innovation costs"}

- id: rs-insightsec-velocity
  from: insight-security-level
  to: ai-lab-velocity
  type: influences
  sign: "-"
  claims:
    - {author: "RAND (Brass-Gershovich et al.)", channel: primary, evidence: expert-judgment, qualifier: "noticeable at ISL3; 'likely to fundamentally reshape how organizations operate' at ISL4–5", doc: brassgershovich-2026-algorithmic, loc: "p.19", quote: "Measures that effectively defend against sophisticated adversaries often constrain collaboration, slow development velocity, limit work flexibility, and increase operational overhead."}
    - {author: "RAND (Brass-Gershovich et al.)", channel: primary, evidence: expert-judgment, doc: brassgershovich-2026-algorithmic, loc: "p.26", quote: "The personnel exclusivity requirement (i.e., no cross-compartment personnel) is particularly challenging with AI research because researchers often need to integrate insights across multiple domains."}

- id: rs-personnel-velocity
  from: personnel-security
  to: ai-lab-velocity
  type: influences
  sign: "-"
  note: Also a pressure AGAINST keeping personnel controls under growth or race (us-security.md §3(d)).
  claims:
    - {author: "AISP (Gekker et al.)", channel: primary, evidence: argument, qualifier: "shares authors with RAND-ISL", doc: gekker-2026-aisp, loc: "p.45", quote: "Overly restrictive personnel security can create single points of failure, slow research, and make organizations less attractive to top talent."}

# ai-lab-velocity (named developer-velocity until 2026-09-27) is one lab's R&D speed. Joseph's development-speed
# (concepts.yaml) feeds it: r-devspeed-labvelocity. It has no outgoing relation yet.

# ======================================================= diffusion: where security failure becomes proliferation
- id: rs-weighttheft-diffusion
  from: weight-theft
  to: capability-diffusion
  type: influences
  sign: "+"
  claims:
    - {author: "RAND (Nevo et al.)", channel: primary, evidence: incident, qualifier: "'leaked' (not 'stolen'); IASR 2026 counts no confirmed theft", doc: nevo-2024-securing, loc: "p.1", quote: "There is already at least one known case (and arguably two) in which one of the most capable models of its time was irreversibly leaked."}

- id: rs-insight-diffusion
  from: insight-leakage
  to: capability-diffusion
  type: influences
  sign: "+"
  claims:
    - {author: Anthropic, channel: primary, evidence: argument, qualifier: "one of four acceleration mechanisms the developer attributes to itself", doc: anthropic-2026-risk-report-aug, loc: "§5.1, p.158", quote: "The possibility of internal research advances diffusing more broadly, e.g. via intellectual property leaks or other developers inferring paths to capability improvement from studying our models."}
    - {author: "RAND (Brass-Gershovich et al.)", channel: "relay: us-security.md", evidence: definition, doc: brassgershovich-2026-algorithmic, loc: "p.4", quote: "Algorithmic insights are the novel techniques, methods, or design know-how that materially improve the efficiency, performance, deployability, or similar desirable features of AI systems."}

- id: rs-distill-diffusion
  from: distillation-extraction
  to: capability-diffusion
  type: influences
  sign: "+"
  claims:
    - {author: xAI, channel: "relay: company-frameworks-xai-others.md", evidence: none-stated, qualifier: "'have been shown' with no citation given", doc: xai-2026-faif, loc: "p.8", quote: "large-scale extraction and distillation of reasoning traces, which have been shown to be highly effective in quickly reproducing advanced capabilities"}
    - {author: Anthropic, channel: primary, evidence: measurement, qualifier: "developer's own fine-tuning experiments; 'highly uncertain' that they represent real attackers", doc: anthropic-2026-risk-report-aug, loc: "§5.1.1, p.159", quote: "If the resulting distilled model inherits risk-relevant capabilities of the original model but is served without adequate safeguards, this could impose risk on the world downstream of the original model's capabilities"}
    - {author: "NCSC & UK AISI (joint blog)", channel: "relay: uk-security-frameworks.md", evidence: definition, qualifier: "glossary; distillation as a general transfer process", doc: ncsc-2026-frontier-defenders, quote: "capabilities developed in frontier models can be transferred into smaller, cheaper, or open-weight models through a process called distillation"}

- id: rs-antidistill-distill
  from: anti-distillation-measures
  to: distillation-extraction
  type: influences
  sign: "-"
  claims:
    - {author: Anthropic, channel: primary, evidence: measurement, qualifier: "developer's own experiments; bypass mitigations 'not yet highly robust'", doc: anthropic-2026-risk-report-aug, loc: "§5.1.1.2, p.162", quote: "We see fairly clear reductions in uplift across agentic coding and cyber evaluations, but see slightly mixed results on some of our biology-related evaluations."}

- id: rs-diffusion-pace
  from: capability-diffusion
  to: capability-pace
  type: influences
  sign: "+"
  claims:
    - {author: Anthropic, channel: primary, evidence: argument, qualifier: "'directionally risk-increasing … we don't consider it fully obvious' (fn 82)", doc: anthropic-2026-risk-report-aug, loc: "§5.1, p.158", quote: "by developing models with powerful capabilities, we potentially enable other developers to do so faster"}

- id: rs-diffusion-attacker
  from: capability-diffusion
  to: external-attacker-capability
  type: influences
  sign: "+"
  claims:
    - {author: UK AISI, channel: "relay: uk-security-frameworks.md", evidence: argument, qualifier: "about open release; open models lag the frontier by 4–7 months on cyber", doc: aisi-2026-open-weight-cyber, quote: "open weight release therefore creates a persistent and irreversible risk of misuse"}
    - {author: "UK Cabinet Office (CRA)", channel: "relay: uk-security-frameworks.md", evidence: argument, qualifier: "could", doc: cabinetoffice-2025-cra, loc: "p.42", quote: "Easier access to AI, particularly open-source models, could empower less sophisticated malicious actors"}

- id: rs-cyber-attacker
  from: offensive-cyber-capability
  to: external-attacker-capability
  type: influences
  sign: "+"
  note: Holds to the extent attackers can use the capability (via diffusion, or misuse of access). NCSC also says AI will be used to enhance defence.
  claims:
    - {author: UK NCSC, channel: "relay: uk-security-frameworks.md", evidence: expert-judgment, qualifier: "almost certainly (PHIA); Jan 2024 assessment, two-year horizon", doc: ncsc-2024-near-term, loc: "PDF p.3", quote: "Artificial intelligence (AI) will almost certainly increase the volume and heighten the impact of cyber attacks over the next two years."}

- id: rs-diffusion-weightsec
  from: capability-diffusion
  to: weight-security-level
  type: influences
  sign: "-"
  note: Diffusion erodes the case for security. Three independent source clusters build the same relaxation rule into their frameworks.
  claims:
    - {author: "Google DeepMind (FSF v3.1)", channel: "relay: company-frameworks-gdm.md", evidence: argument, qualifier: "relaxation condition on security levels (self-d)", doc: gdm-2026-fsf-v3-1, loc: "p.11", quote: "may be adjusted if … a model does not possess capabilities meaningfully different from other publicly available models that have weaker security applied"}
    - {author: "RAND (Nevo et al.)", channel: "relay: us-security.md", evidence: argument, doc: nevo-2024-securing, loc: "p.4", quote: "Once a model has been made publicly available (which is often referred to as 'open-sourcing' it), there is no longer value in securing specific copies of it."}

- id: rs-diffusion-regulation
  from: capability-diffusion
  to: code-commitments
  type: influences
  sign: "-"
  note: The EU Code's security commitment switches off for any model weaker than the best open-weight model.
  claims:
    - {author: EU GPAI Code, channel: "relay: eu.md", evidence: definition, qualifier: "scope rule; applies to Commitment 6 (security) only", doc: eu-cop-2025-safety-security, loc: "p.18", quote: "A model is exempt from this Commitment if the model's capabilities are inferior to the capabilities of at least one model for which the parameters are publicly available for download."}

- id: rs-diffusion-race
  from: capability-diffusion
  to: race-dynamics
  type: influences
  sign: "+?"
  note: Closes several reinforcing loops (theft → diffusion → race → weaker security → theft). The commercial channel looks weak by Anthropic's account; a geopolitical channel is the hypothesis.
  claims:
    - {author: "integrator (Claude)", channel: dialog, evidence: argument, qualifier: "hypothesis (ours): rivals narrowing the gap raises pressure to move faster"}
    - {author: Anthropic, channel: primary, evidence: expert-judgment, qualifier: "partial counter-evidence: distillers mostly do not compete for customers", doc: anthropic-2026-risk-report-aug, loc: "fn 83, p.159", quote: "competitors with much less capable models than ours improving the capabilities to the point where they could impose risks on the world (while still being unlikely to compete directly for most of our customers)"}

# ======================================================= detection
- id: rs-weighttheft-detected
  from: weight-theft
  to: detected-incidents
  type: influences
  sign: "+?"
  note: Weak by nature. Theft by a sophisticated insider or state may never be detected, so the balancing loop through perceived risk (theft → detection → resourcing → security) can run silent.
  claims:
    - {bears_on: "to", author: IASR 2026 writing team, channel: "relay: uk.md", evidence: measurement, qualifier: "a count of confirmed, public cases; silent on undetected theft", doc: bengio-2026-international, loc: "Box 3.1, p.136", quote: "As of December 2025, there are no confirmed, publicly documented instances of model weight theft."}
    - {author: "AISP (Gekker et al.)", channel: primary, evidence: argument, qualifier: "bears on detectability", doc: gekker-2026-aisp, loc: "p.43", quote: "A single compromised insider - whether compromised through financial pressure, foreign recruitment, or ideological motivations - could exfiltrate years of research in minutes."}
    - {author: EU GPAI Code, channel: "relay: eu.md", evidence: definition, qualifier: "reporting duty (5-day initial report); surfaces detected cases to the AI Office", doc: eu-cop-2025-safety-security, loc: "Measure 9.3", quote: "a serious cybersecurity breach, including the (self-)exfiltration of model weights"}

# ======================================================= human insiders
- id: rs-insider-weighttheft
  from: insider-exfiltration
  to: weight-theft
  type: influences
  sign: "+"
  note: Route to outcome. Core insider-exfiltration pools weights and insights; this and rs-insider-insight separate them.
  claims:
    - {author: EU GPAI Code, channel: "relay: eu.md", evidence: definition, qualifier: "glossary", doc: eu-cop-2025-safety-security, loc: "glossary", quote: "access or transfer of weights or associated assets of a model from their secure storage by the model itself and/or an unauthorised actor."}

- id: rs-insider-insight
  from: insider-exfiltration
  to: insight-leakage
  type: influences
  sign: "+"
  claims:
    - {author: "RAND (Brass-Gershovich et al.)", channel: "relay: us-security.md", evidence: definition, doc: brassgershovich-2026-algorithmic, loc: "p.13 fn 1", quote: "An insider with legitimate access to insights who transfers those insights to an unauthorized party is acting without authorization under this framework"}

- id: rs-personnel-exfil
  from: personnel-security
  to: insider-exfiltration
  type: influences
  sign: "-"
  claims:
    - {author: "RAND (Brass-Gershovich et al.)", channel: primary, evidence: expert-judgment, qualifier: "benchmark at ISL3 and above; framework 'descriptive rather than prescriptive'", doc: brassgershovich-2026-algorithmic, loc: "p.22", quote: "An insider-threat program becomes essential. Because a single knowledgeable employee can constitute a complete vector for insight theft, behavioral monitoring through user and entity behavior analytics (UEBA) systems, employee spot-checking, new-hire screening, and rigorous offboarding procedures are critical."}
    - {author: "RAND (Nevo et al.)", channel: primary, evidence: expert-judgment, qualifier: "emerging point of consensus among interviewed experts", doc: nevo-2024-securing, loc: "p.18", quote: "Experts generally agreed that this is a significant source of risk and that significant efforts should be dedicated to mitigating it."}

- id: rs-accessmin-mod
  from: access-minimization
  type: moderates
  targets: [r-access-exfil, r-growth-access]
  sign: "-"
  note: 'Decouples weight security from headcount. RAND-ISL says the equivalent lever for insights is bounded ("possibly even infeasible"), so this moderation is strong for weights and weak for insights.'
  claims:
    - {author: "RAND (Nevo et al.)", channel: primary, evidence: expert-judgment, qualifier: "SL3 benchmark caps", doc: nevo-2024-securing, loc: "App. B, p.80", quote: "Output-limited arbitrary access is limited to 100 people, access to an isolated network with direct access is limited to 50 people, and the ability to make copies of the weights is limited to 20 people."}
