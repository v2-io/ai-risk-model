# Lexicon: each source's term, mapped onto our concepts (SKOS-style).
# rel (from the SOURCE term to OUR concept):
#   exact = same concept · close = near-interchangeable · broad = source term is BROADER than our concept
#   narrow = source term is NARROWER than our concept · related = associated but not the same thing
# A broad source term that maps to several of our concepts is the "pooling" this file exists to expose.
# channel: how the quote reached this file. "primary" = read by the integrator in the source;
#   "relay: <file>" = taken from that verification file.

# ---- loss of control: one word, many scales
