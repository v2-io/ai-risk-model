# ---- AISI's own vocabulary for loss of control (from uk.md §6). AISI has no "loss of control" definition; its domain is "Autonomous Systems".
- {concept: unsanctioned-action, rel: broad, src: aisi-2025-research, term: "Autonomous Systems (risk domain)", loc: "PDF p.6", quote: "Risks posed by the misuse of AI systems escalating out of control or systems taking harmful action without meaningful human oversight.", channel: "relay: uk.md", note: "AISI's domain spans from 'harmful action without meaningful human oversight' to 'attempting to permanently circumvent human control', i.e. unsanctioned-action through loc-strict. It also folds in misuse escalating out of control."}
- {concept: loc-bounded, rel: broad, src: aisi-2025-research, term: "Autonomous Systems (risk domain)", loc: "PDF p.6", channel: "relay: uk.md"}
- {concept: loc-strict, rel: broad, src: aisi-2025-research, term: "Autonomous Systems (risk domain)", loc: "PDF p.12", quote: "the propensity of these models to engage in severely misaligned actions, such as causing direct catastrophic harm or attempting to permanently circumvent human control.", channel: "relay: uk.md"}
- {concept: internal-ai-deployment, rel: related, src: aisi-2025-research, term: "loss of control at AI labs", loc: "PDF p.13", channel: "relay: uk.md", note: "An AISI operational threat-model label; the Control side-tasks are weight exfiltration, secret exfiltration, rogue internal deployments and sabotaging safety research (PDF p.28)."}
- {concept: loc-strict, rel: close, src: aisi-2025-frontier, term: "catastrophic, irreversible loss of control", loc: "p.29", quote: "In a worst-case scenario, this unintended behaviour could lead to catastrophic, irreversible loss of control over advanced AI systems.", channel: "relay: uk.md"}
- {concept: oversight-strength, rel: close, src: bengio-2025-international, term: "Control", loc: "p.100", quote: "The ability to exercise oversight over an AI system and adjust or halt its behaviour if it is acting in unwanted ways.", channel: "relay: uk.md"}
- {concept: loc-passive, rel: close, src: dsit-2023-capabilities, term: "loss of control (first factor)", loc: "pp.25–26", quote: "Humans increasingly hand over control of important decisions to AIs. It becomes increasingly difficult for humans to take back control.", channel: "relay: uk.md", note: "DSIT operationalizes loss of control as two factors; the second maps to misaligned-propensity."}
- {concept: misaligned-propensity, rel: related, src: dsit-2023-capabilities, term: "loss of control (second factor)", loc: "pp.25–26", quote: "AI systems actively seek to increase their own influence and reduce human control.", channel: "relay: uk.md"}
- {concept: loc-strict, rel: related, src: goscience-2023-future, term: "Loss of human control and oversight", loc: "¶85(f), p.24", quote: "Loss of human control and oversight, with an autonomous model then taking harmful actions.", channel: "relay: uk.md", note: "One of Annex A's existential-risk pathways; 'NOT A STATEMENT OF GOVERNMENT POLICY'."}
- {concept: agent-autonomy, rel: close, src: bengio-2026-international, term: "Enabling deployment environment (Criticality, Access, Permissions)", loc: "p.82", channel: "relay: uk.md", note: "IASR 2026's third required factor for loss of control."}
- {concept: loc-bounded, rel: related, src: california-2025-sb53, term: "critical safety incident: loss of control causing death or bodily injury", loc: "§22757.11(d)(3)", quote: "Loss of control of a frontier model causing death or bodily injury.", channel: "relay: eu.md", note: "Law. A reportable-incident definition with a harm threshold but no catastrophe threshold."}
- {concept: unsanctioned-action, rel: related, src: california-2025-sb53, term: "critical safety incident: deceptive subversion of controls", loc: "§22757.11(d)(4)", quote: "A frontier model that uses deceptive techniques against the frontier developer to subvert the controls or monitoring of its frontier developer outside of the context of an evaluation designed to elicit this behavior and in a manner that demonstrates materially increased catastrophic risk.", channel: "relay: eu.md"}
- {concept: loc-strict, rel: related, src: eu-2024-ai-act, term: "unintended issues of control relating to alignment with human intent", loc: "recital 110", channel: "relay: eu.md", note: "The AI Act's closest language to loss of control; the Act never uses 'loss of control'."}
- {concept: loc-strict, rel: related, src: mitre-2025-agi, term: "loss-of-control scenario (AGI as independent actor)", loc: "p.6", quote: "In the extreme, a loss-of-control scenario could result, wherein AGI's pursuit of its desired objectives incentivizes the machine to resist being turned off, counter to human efforts", channel: "relay: us-security.md", note: "Global/strategic scale: 'practically an independent actor on the global stage'."}
- {concept: misaligned-propensity, rel: related, src: nist-2026-rfi-agents, term: "uncompromised models that pursue misaligned objectives (as a security risk)", loc: "p.699", quote: "the risk that the behavior of uncompromised models may nonetheless pose a threat to confidentiality, availability, or integrity (e.g., models that exhibit specification gaming or otherwise pursue misaligned objectives)", channel: "relay: us-security.md", note: "CAISI frames at agent/system-security scale what the EU and IASR frame as loss of control."}
- {concept: misaligned-propensity, rel: related, src: nist-2025-managing, term: "evasion of human control or oversight (dual-use criterion)", loc: "Glossary p.22", quote: "permitting the evasion of human control or oversight through means of deception or obfuscation", channel: "relay: us-security.md", note: "A capability criterion from EO 14110 (reportedly rescinded Jan 2025 [U]); draft guidance."}
- {concept: oversight-strength, rel: broad, src: gekker-2026-aisp, term: "control", loc: "p.34", quote: "'control' can refer to a very general problem of steering AI systems, or to a specific set of guardrails for artificial general intelligence.", channel: "relay: us-security.md", note: "AISP names the pooling itself."}
- {concept: loc-bounded, rel: related, src: tkeshelashvili-2026-loc-iw, term: "loss of control (IST)", loc: "p.1", quote: "a hypothetical state in which an AI system diverges from authorized constraints to the extent that the human operator is no longer able to prevent, constrain, or revert undesired and unintended outcomes", channel: "relay: remaining-literature.md", note: "No severity threshold; IST's Levels 0–5 count present-day events (Level 2: isolated production incidents)."}
- {concept: loc-strict, rel: broad, src: ecosystem-2026-2026, term: "loss of control (2026 Singapore Consensus)", loc: "p.24", quote: "includes both scenarios that involve passively ceding control and scenarios that involve AI systems actively undermining control measures", channel: "relay: remaining-literature.md", note: "Pools active and passive; the 2026 IASR separates them."}
- {concept: loc-passive, rel: broad, src: ecosystem-2026-2026, term: "loss of control (2026 Singapore Consensus)", loc: "p.24", channel: "relay: remaining-literature.md"}
- {concept: loc-passive, rel: related, src: kasirzadeh-2024-types, term: "accumulative AI x-risk", loc: "p.9", quote: "the build-up of a series of smaller, lower-severity disruptions over time, collectively and gradually weakening systemic resilience until a triggering event causes unrecoverable collapse", channel: "relay: remaining-literature.md", note: "Accumulation ends in a trigger event, so this is not purely passive."}
- {concept: loc-passive, rel: related, src: gruetzemacher-2026-loss, term: "accidental LOC", loc: "p.2", quote: "LOC from systemic factors—gradual disempowerment, multi-agent systems exceeding oversight capacity, or emergent coordination", channel: "relay: remaining-literature.md", note: "Gruetzemacher files gradual disempowerment as recoverable ('extremely costly'); Kulveit calls it 'effectively irreversible'. Same phenomenon, opposite ends of the persistence axis."}
- {concept: oversight-strength, rel: related, src: chin-2026-reframing, term: "control", loc: "p.9", quote: "Control is the ability to set plausibly attainable goals that are not a foregone conclusion, and reliably achieve those goals", channel: "relay: remaining-literature.md", note: "Chin et al. hold that loss of control in their sense 'already exist[s], and [has] existed for a long time'."}
