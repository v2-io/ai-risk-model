- {concept: oversight-evasion-capability, rel: close, src: microsoft-2026-frontier-governance-framework, term: "Loss of control (a tracked capability)", loc: "p.3", quote: "A model's ability to undermine effective human control through adaptive, deceptive, or self-reinforcing mechanisms such that, when deployed, a model can no longer be reliably directed, modified, or shut down.", channel: "relay: company-frameworks-meta-msft-amzn.md", note: "The same two words that name an outcome in the EU Code name a capability here. No threshold set yet (p.14)."}
