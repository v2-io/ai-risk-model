- {concept: oversight-evasion-capability, rel: broad, src: openai-2025-preparedness-framework-v2, term: "Undermining Safeguards (research category)", loc: "Table 2, p.7", channel: "relay: company-frameworks-openai.md", note: "Pools ability and propensity, and includes collusion."}
- {concept: ai-rnd-capability, rel: close, src: anthropic-2026-rsp-v3-4, term: "Automated R&D in key domains", loc: "p.8", quote: "AI systems that can fully automate, or otherwise dramatically accelerate, the work of large, top-tier teams of human researchers", channel: "relay: company-frameworks-anthropic.md"}
