# Lexicon for the model-properties, evaluation and failure-modes slice (shard).
# rel is from the SOURCE term to OUR concept: exact · close · broad (source broader) · narrow · related.
# channel: "primary" = read by this agent in the source this session; "relay: <file>" = taken from that verification file.

# ---- §5.4 whose intent counts in "misalignment": one word, many referents
- {concept: misaligned-propensity, rel: close, src: bengio-2026-international, term: "Misalignment", loc: "glossary", quote: "An AI’s propensity to use its capabilities in ways that conflict with human intentions, values, or norms. Depending on the context, this can refer to the intentions and values of various entities, such as developers, users, specific communities, or society as a whole.", channel: "primary (influx/iasr-2026-full.md)", note: "Referent: developers, users, communities or society, 'depending on the context'."}
- {concept: misaligned-propensity, rel: narrow, src: bengio-2026-international, term: "'misaligned' (Box 2.5)", loc: "Box 2.5", quote: "When a model acquires goals that conflict with the intentions of its developers, it is ‘misaligned’.", channel: "primary (influx/iasr-2026-full.md)", note: "Same report, developer-only referent. IASR uses two referents in one document."}
- {concept: misaligned-propensity, rel: close, src: slattery-2026-risk, term: "7.1 AI pursuing its own goals in conflict with human goals or values", quote: "AI systems that act in conflict with ethical standards or human goals or values, especially the goals of designers or users", channel: "relay: academic-ngo.md", note: "Referent: designers or users, plus ethical standards."}
- {concept: misaligned-propensity, rel: related, src: dsit-2023-capabilities, term: "Alignment (a process)", loc: "glossary p.29", quote: "the process of ensuring an AI system's goals and behaviours are in line with human values and intentions.", channel: "relay: uk.md", note: "A process, not a propensity."}
- {concept: misaligned-propensity, rel: related, src: goscience-2023-future, term: "misaligned system (a capability)", loc: "p.25 fn iii", quote: "A misaligned system can be considered one that has the capability to pursue an objective in unintended ways", channel: "relay: uk.md", note: "Framed as capability, not propensity. Referent: 'limitations embedded during development, and more broadly moral or ethical norms'."}
- {concept: misaligned-propensity, rel: narrow, src: cltr-2026-loc-incidents-worsening, term: "Misalignment", loc: "PDF p.6", quote: "the AI system's goals differ from the intentions or interests of its developers or deployers", channel: "relay: remaining-literature.md", note: "Referent: developers or deployers."}
- {concept: misaligned-propensity, rel: narrow, src: hammond-2025-multi, term: "alignment (to a principal)", loc: "p.43", quote: "the problem of ensuring that an individual AI system acts according to the values and preferences of its principal", channel: "relay: remaining-literature.md", note: "Referent: the principal. Hammond's §'Alignment is Not Enough' argues multi-agent failure survives perfect principal alignment."}
- {concept: misaligned-propensity, rel: related, src: kulveit-2025-gradual, term: "alignment (of societal systems)", loc: "fn 1, p.2", quote: "the degree to which a system satisfies what humans want (individually or collectively), for both specific AI systems and societal systems", channel: "relay: remaining-literature.md", note: "Extends the term to institutions."}
- {concept: misaligned-propensity, rel: narrow, src: ren-2024-safetywashing, term: "alignment (to operators)", loc: "p.5", quote: "how well AI systems follow the goals of their operators", channel: "relay: remaining-literature.md"}
- {concept: misaligned-propensity, rel: close, src: anthropic-2026-frontier-compliance-framework-v2, term: "goals that conflict with developers' intentions or users' interests", loc: "p.8", quote: "scenarios where AI models develop and pursue goals autonomously that conflict with their developers' intentions or users' interests", channel: "relay: company-frameworks-anthropic.md", note: "Inside Anthropic's law-backed loss-of-control definition. Referent: developer or users."}
- {concept: misaligned-propensity, rel: narrow, src: gdm-2026-gemini-3-7-flash-fsf-report, term: "scheming", loc: "p.36", quote: "‘scheming’ (also known as deceptive alignment), where a model knowingly and covertly pursues objectives misaligned with its developer's intention", channel: "relay: company-frameworks-gdm.md", note: "Developer-only, and covert. Narrower than Shah et al.'s 'knowingly causes harm against the intent of the developer' (core mapping)."}
- {concept: misaligned-propensity, rel: related, src: xai-2025-faif, term: "value systems misaligned with humanity's interests", loc: "p.6", quote: "It is also possible that AIs may develop value systems that are misaligned with humanity's interests and inflict widespread harms upon the public.", channel: "relay: company-frameworks-xai-others.md", note: "Referent: humanity. Removed in the June 2026 FAIF, which has no misalignment language beyond 'concerning propensities'."}
- {concept: misaligned-propensity, rel: related, src: anthropic-2026-frontier-safety-roadmap, term: "behave in line with our Constitution", quote: "Ensuring that our models themselves do not autonomously cause harm, and instead consistently behave in line with our Constitution", channel: "relay: company-frameworks-anthropic.md", note: "Referent: a published constitution. COI."}
- {concept: misaligned-propensity, rel: related, src: openai-2026-pacing-model-development, term: "alignment (responsiveness to oversight)", quote: "the work of making AI systems behave as intended and responsive to human oversight", channel: "relay: company-frameworks-openai.md", note: "Referent: intent plus human oversight."}
- {concept: misaligned-propensity, rel: close, src: eu-cop-2025-safety-security, term: "misalignment with human intent / with human values", loc: "App. 1.3.2(1)–(2)", channel: "relay: eu.md", note: "Listed as two separate propensities; neither is defined."}
- {concept: misaligned-propensity, rel: related, src: eu-cop-2025-safety-security, term: "lawlessness", loc: "App. 1.3.2(7)", quote: "lawlessness, i.e. acting without reasonable regard to legal duties that would be imposed on similarly situated persons", channel: primary, note: "Referent: the law. The only source here whose referent is neither a person nor a value set."}
- {concept: misaligned-propensity, rel: narrow, src: eu-cop-2025-safety-security, term: "power-seeking / 'goal-pursuing'", loc: "App. 1.3.2(8)", channel: "relay: eu.md"}
- {concept: misaligned-propensity, rel: narrow, src: aisi-2025-misalignment-investigation, term: "misalignment (operational)", quote: "if it has learned to act in ways that preserve or extend its own capabilities – or those of its successors – even when this conflicts with its intended purpose", channel: "relay: uk-security-frameworks.md", note: "Referent: 'intended purpose'."}
- {concept: misaligned-propensity, rel: related, src: arnold-2021-ai-accidents, term: "Failures of specification", loc: "p.7", quote: "the system is trying to achieve something subtly different from what the designer or operator intended", channel: "relay: academic-ngo.md", note: "Accident framing; no intent implied."}
- {concept: misaligned-propensity, rel: related, src: hendrycks-2023-overview, term: "rogue AIs", loc: "printed p.34", quote: "systems that pursue goals against our interests", channel: "relay: academic-ngo.md", note: "Pools deliberately unleashed agents with systems that 'go rogue'; GDM splits these into misuse and misalignment."}

# ---- situational and evaluation awareness
- {concept: situational-awareness, rel: exact, src: bengio-2026-international, term: "Situational awareness", loc: "Table 2.5", quote: "The ability of an AI system to access and use information about itself, the processes by which it can be modified, or the context in which it is deployed (e.g. knowing that it is being tested).", channel: "primary (influx/iasr-2026-full.md)"}
- {concept: situational-awareness, rel: narrow, src: eu-cop-2025-safety-security, term: "ability to know if it is being evaluated", loc: "App. 1.3.1(8)", channel: primary, note: "Listed as a capability, a risk source."}
- {concept: situational-awareness, rel: close, src: gdm-2026-fsf-v3-1, term: "situational awareness (TCL)", loc: "p.14", quote: "situational awareness (ability to discover and use relevant details of its deployment setting)", channel: "relay: company-frameworks-gdm.md"}
- {concept: situational-awareness, rel: exact, src: shevlane-2023-model, term: "Situational awareness", loc: "Table 1, p.5", channel: "relay: academic-ngo.md"}
- {concept: evaluation-awareness, rel: close, src: nist-2026-ai-800-2-ipd, term: "Evaluation awareness", loc: "pp.21–22", quote: "model behavior can be influenced by cues that the input is part of an evaluation exercise", channel: "relay: us-gov-recent.md"}
- {concept: evaluation-awareness, rel: close, src: asd-2026-careful-agentic, term: "behaviour change under evaluation", loc: "p.7", quote: "LLM based agents may change their behaviour when evaluations are underway and may even bypass system-level instructions to achieve their objectives", channel: "relay: uk-security-frameworks.md"}
- {concept: oversight-evasion-capability, rel: related, src: eu-cop-2025-safety-security, term: "deception (glossary)", quote: "model behaviours that systematically produce false beliefs in others, including model behaviours to achieve goals that involve evading oversight, such as a model's detecting that it is being evaluated and under-performing or otherwise undermining oversight.", channel: "relay: eu.md", note: "Pools deception, evaluation awareness and sandbagging in one definition."}

# ---- sandbagging, reward hacking, cheating
- {concept: sandbagging-propensity, rel: exact, src: aisi-2026-loss-oversight, term: "Sandbagging", loc: "App. C", quote: "Deliberately and selectively underperforming on a task, for example to conceal true capabilities during capability evaluations or to undermine untrusted monitoring", channel: "relay: uk-security-frameworks.md", note: "Intent-laden."}
- {concept: sandbagging-propensity, rel: close, src: aisi-2025-frontier, term: "Sandbagging", loc: "glossary p.51", quote: "A phenomenon where AI models underperform during evaluations but display stronger capabilities outside of testing environments.", channel: "relay: uk-security-frameworks.md", note: "Not intent-laden. Two AISI definitions differ."}
- {concept: sandbagging-propensity, rel: exact, src: bengio-2026-international, term: "Sandbagging", loc: "glossary", quote: "Behaviour where a model or system performs below its capabilities on evaluations, potentially to avoid further scrutiny or restrictions.", channel: "primary (influx/iasr-2026-full.md)"}
- {concept: sandbagging-propensity, rel: broad, src: openai-2025-preparedness-framework-v2, term: "Sandbagging (research category)", loc: "Table 2, p.7", quote: "ability and propensity to respond to safety or capability evaluations in a way that significantly diverges from performance under real conditions", channel: "relay: company-frameworks-openai.md", note: "Pools the ability with the propensity."}
- {concept: sandbagging-propensity, rel: broad, src: eu-cop-2025-safety-security, term: "model deception during model evaluations (e.g. sandbagging)", loc: "App. 3.2(2)", channel: "relay: eu.md"}
- {concept: ai-insider-sabotage, rel: narrow, src: anthropic-2026-risk-report-feb, term: "Diffuse sandbagging on safety-relevant R&D", loc: "§2.6", channel: "relay: company-frameworks-anthropic.md", note: "Sandbagging of work, not of evaluations. The same word covers two roles."}
- {concept: reward-hacking-propensity, rel: exact, src: aisi-2026-loss-oversight, term: "Reward hacking", loc: "App. C", quote: "When a model exploits flaws in the environment and reward signal to achieve high reward without actually solving the intended task.", channel: "relay: uk-security-frameworks.md"}
- {concept: reward-hacking-propensity, rel: close, src: bengio-2026-international, term: "reward hacking", loc: "§2.2.2", quote: "Reward hacking occurs when a model finds unintended shortcuts that score well on training or evaluation objectives without fulfilling the intended goal.", channel: "primary (influx/iasr-2026-full.md)", note: "Covers training AND evaluation, so pools this concept with eval-cheating-propensity."}
- {concept: reward-hacking-propensity, rel: close, src: asd-2026-careful-agentic, term: "specification gaming", loc: "p.10", quote: "Goal misalignment and unintended behaviour … This behaviour is known as specification gaming", channel: "relay: uk-security-frameworks.md", note: "CAREFUL files it under goal misalignment."}
- {concept: eval-cheating-propensity, rel: close, src: nist-2026-ai-800-2-ipd, term: "Evaluation cheating", loc: "p.21", quote: "Evaluation cheating occurs when a model has an opportunity to solve a test item in an unintended way that undermines its measurement validity.", channel: "relay: us-gov-recent.md", note: "CAISI: cheating is defined by 'the evaluator's intent, not the question of the model's'."}

