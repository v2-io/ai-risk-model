- id: mp-crossingcost-integrity
  from: threshold-crossing-cost
  to: risk-assessment-integrity
  type: influences
  sign: "-"
  claims:
    - {author: "Karnofsky (Anthropic; views his own)", channel: primary, evidence: expert-judgment, qualifier: "first-person account of RSP v2.2; 'I don't think we have actually made unreasonable calls'; Anthropic-affiliated (COI)", doc: karnofsky-2026-rsp-v3, loc: "print p.10 of 45", quote: "It also felt like our risk assessment was subject to distortive pressures. We knew that if we declared a model to cross the CBRN-4 or AI R&D-5 line, this could be extremely damaging to the company (in that our RSP would then require a unilateral pause or slowdown in AI development and deployment), while having little discernible public benefit (see above). It seemed to me that there was an enormous amount of pressure to declare our systems to lack relevant capabilities"}
    - {author: "UK AISI (Taylor et al.)", channel: "relay: uk-security-frameworks.md", evidence: argument, qualifier: "the project team's view; about acting on signals, which bears on determinations", doc: aisi-2026-loss-oversight, loc: "§7.2, p.51", quote: "Halting a deployment, retraining, or rolling back to an earlier checkpoint has direct, attributable costs in lost revenue, competitive speed, or foregone research, whereas the cost of not acting on a concerning signal is typically diffuse and externalised … This asymmetry biases decisions towards inaction."}

- id: mp-verif-crossingcost-mod
  from: external-verification
  type: moderates
  targets: [mp-crossingcost-integrity]
  note: Pre-registration can also be internal; it is filed here under external verification because the evidence is an external evaluator's practice.
  sign: "-"
  claims:
    - {author: "UK AISI (Taylor et al.)", channel: "relay: uk-security-frameworks.md", evidence: definition, qualifier: "report glossary", doc: aisi-2026-loss-oversight, loc: "App. C", quote: "Pre-registration reduces motivated reasoning ahead of development and deployment decisions and makes oversight commitments credible to external parties."}
    - {author: "NIST (CAISI)", channel: "relay: us-gov-recent.md", evidence: established-practice, doc: nist-2026-caisi-deepseek-v4, quote: "CAISI pre-committed to its overall benchmark suite, i.e. did not select benchmarks on the basis of results"}

- id: mp-pause-crossingcost
  from: pause-commitments
  to: threshold-crossing-cost
  type: influences
  sign: "+"
  claims:
    - {author: "Karnofsky (Anthropic; views his own)", channel: primary, evidence: expert-judgment, qualifier: "first-person account of RSP v2.2; COI", doc: karnofsky-2026-rsp-v3, loc: "print p.10 of 45", quote: "We knew that if we declared a model to cross the CBRN-4 or AI R&D-5 line, this could be extremely damaging to the company (in that our RSP would then require a unilateral pause or slowdown in AI development and deployment)"}

- id: mp-crossingcost-loosening
  from: threshold-crossing-cost
  to: commitment-loosening
  type: influences
  sign: "+"
  note: With mp-pause-crossingcost and gv-loosen-pause, a balancing loop the source describes as a whole. Pause commitments make a crossing costly; the cost distorts assessment; the distortion is given as a reason to drop the commitments.
  claims:
    - {author: "Karnofsky (Anthropic; views his own)", channel: primary, evidence: argument, qualifier: "the author's account of RSP v3's main change; COI", doc: karnofsky-2026-rsp-v3, loc: "print p.13 of 45", quote: "The move away from implied unilateral commitments to “pause AI development/deployment as needed to keep risks low” is the biggest change of RSP v3"}
    - {author: "Karnofsky (Anthropic; views his own)", channel: primary, evidence: argument, qualifier: "one of several stated reasons; COI", doc: karnofsky-2026-rsp-v3, loc: "print p.10 of 45", quote: "Overall, it felt to me that the requirements people perceived the RSP to impose on us here were unreasonable on the merits (on a “unilateral action” basis), detrimental to our risk assessment and broader epistemic environment"}

- id: mp-race-crossingcost
  from: race-dynamics
  to: threshold-crossing-cost
  type: influences
  sign: "+"
  claims:
    - {author: Anthropic, channel: "relay: company-frameworks-anthropic.md", evidence: argument, qualifier: "developer's rationale for RSP v3; COI", doc: anthropic-2026-rsp-v3-4, loc: "Introduction, p.3", quote: "If one AI developer paused development to implement safety measures while others moved forward … the developers with the weakest protections would set the pace"}

# ======================================================= staleness: judgments outliving the capabilities they were made for
- id: mp-pace-staleness
  from: capability-pace
  to: safety-judgment-staleness
  type: influences
  sign: "+"
  claims:
    - {author: UK AISI (about itself), channel: "relay: uk-security-frameworks.md", evidence: incident, qualifier: "self-assessment after an incident", doc: aisi-2026-incident-blog, loc: "'Why this happened'", quote: "In earlier model generations, this risk trade-off was judged to be acceptable, but we did not revisit that judgment quickly enough as capabilities advanced."}
    - {author: "Five Eyes cyber agency heads", channel: primary, evidence: expert-judgment, qualifier: "joint statement (rec)", doc: fiveeyes-2026-ai-shift, loc: "p.3", quote: "The rapid pace of frontier AI development means cyber risk assumptions can become outdated in months, not years."}
    - {author: "Google DeepMind (FSF v3.1)", channel: "relay: company-frameworks-gdm.md", evidence: instrument, qualifier: "a mitigation whose trigger presupposes the mechanism (self-d)", doc: gdm-2026-fsf-v3-1, loc: "pp.5–6", quote: "We may run early warning evaluations more frequently or adjust alert thresholds if the rate of progress suggests our safety buffer is no longer adequate"}

- id: mp-unpredict-staleness
  from: capability-unpredictability
  to: safety-judgment-staleness
  type: influences
  sign: "+?"
  claims:
    - {author: "integrator (Claude), mp slice", channel: dialog, evidence: argument, qualifier: "integrator inference: estimates made on a release go stale when later checkpoints of the same model differ"}
    - {bears_on: "from", author: UK AISI, channel: "relay: uk-security-frameworks.md", evidence: measurement, qualifier: "capability change after release", doc: aisi-2026-cyber-horizons, quote: "Notable capability jumps do not always require new model releases: later iterations of the same model can also meaningfully change our estimates of frontier capabilities."}

- id: mp-staleness-unsanc
  from: safety-judgment-staleness
  to: unsanctioned-action
  type: influences
  sign: "+"
  claims:
    - {author: UK AISI (about itself), channel: primary, evidence: incident, qualifier: "the evaluator's own conclusion", doc: aisi-2026-incident, loc: "§6.2, p.19", quote: "While the risks arising from internet access seem acceptable for earlier model generations, current models have capabilities and propensities that mean internet access configuration should be reconsidered."}

- id: mp-staleness-oversight
  from: safety-judgment-staleness
  to: oversight-strength
  type: influences
  sign: "-?"
  claims:
    - {author: "UK AISI (Taylor et al.)", channel: primary, evidence: argument, qualifier: "recommendation implying the mechanism", doc: aisi-2026-loss-oversight, loc: "Executive Summary, recommendation 2, p.7", quote: "Model developers should be clear about which oversight properties they are relying on when making safety claims, and assess their exposure to degradations in these properties. Risk assessments should include forward projections of whether key properties will be preserved, so that safety arguments do not silently expire."}

- id: mp-reassess-staleness
  from: reassessment-responsiveness
  to: safety-judgment-staleness
  type: influences
  sign: "-"
  claims:
    - {author: EU GPAI Code, channel: "relay: eu.md", evidence: instrument, qualifier: "commit; 'reasonable grounds' or 12 months", doc: eu-cop-2025-safety-security, loc: "Measure 1.3, p.9", quote: "Signatories will conduct an appropriate Framework assessment, if they have reasonable grounds to believe that the adequacy of their Framework and/or their adherence thereto has been or will be materially undermined, or every 12 months starting from their placing of the model on the market, whichever is sooner."}
    - {author: Meta, channel: "relay: company-frameworks-meta-msft-amzn.md", evidence: instrument, qualifier: "company framework (self)", doc: meta-2026-advanced-ai-scaling-framework, loc: "p.9", quote: "expedited updates if we identify any unprecedentedly rapid increase in capabilities"}

- id: mp-unsanc-reassess
  from: unsanctioned-action
  to: reassessment-responsiveness
  type: influences
  sign: "+"
  note: With mp-staleness-unsanc and mp-reassess-staleness, a balancing loop that damps only after an incident.
  claims:
    - {author: UK AISI (about itself), channel: primary, evidence: incident, doc: aisi-2026-incident, loc: "§1.3, p.3", quote: "AISI will also reassess the configuration of all evaluations, using fine-grained network controls where possible."}
    - {author: EU GPAI Code, channel: "relay: eu.md", evidence: instrument, qualifier: "example ground for reassessment", doc: eu-cop-2025-safety-security, loc: "Measure 1.3(2), p.9", quote: "serious incidents and/or near misses involving their models or similar models that are likely to indicate that the systemic risks … are not acceptable have occurred"}

