# Model properties, evaluation and failure modes (shard). IDs mp-* (relations) and mp-i-* (indicators).
# Channel "primary" = read by this agent in the relata-attached PDF (pdftotext) on 2026-09-27.
# "primary (influx/iasr-2026-full.md)" = read in the clean markdown of IASR 2026; cited by section (no pages there).
# UK AISI Loss of Oversight and incident report: printed pages (= PDF - 1). Karnofsky: LessWrong print page.
# Notes, core proposals and extra claims for core relations: notes-mp.md.

# ======================================================= capability structure
- id: mp-pace-level
  from: capability-pace
  to: frontier-capability-level
  type: influences
  sign: "+"
  note: Flow into stock.
  claims:
    - {author: "integrator (Claude), mp slice", channel: dialog, evidence: definition, qualifier: "stock-and-flow identity (ours)"}

- id: mp-level-agentic
  from: frontier-capability-level
  to: agentic-capability
  type: influences
  sign: "+"
  claims:
    - {author: "integrator (Claude), mp slice", channel: dialog, evidence: definition, qualifier: "a component of general capability; the sources measure only the endpoint"}
    - {bears_on: "to", author: IASR 2026 writing team, channel: "primary (influx/iasr-2026-full.md)", evidence: measurement, qualifier: "trend; agents 'currently lack the capacity for the sustained autonomous operation required by loss of control scenarios'", doc: bengio-2026-international, loc: "§2.2.2 'Long-term autonomous operation is not yet feasible'", quote: "the time horizons on which agents can autonomously operate are lengthening rapidly, having doubled on average every seven months since 2019."}

- id: mp-level-airnd
  from: frontier-capability-level
  to: ai-rnd-capability
  type: influences
  sign: "+"
  claims:
    - {author: "integrator (Claude), mp slice", channel: dialog, evidence: definition, qualifier: "a component of general capability; the sources measure only the endpoint"}
    - {bears_on: "to", author: IASR 2026 writing team, channel: "primary (influx/iasr-2026-full.md)", evidence: argument, qualifier: "update statement; the sources measure the endpoint, the link is integrator inference", doc: bengio-2026-international, loc: "§2.2.2 Updates", quote: "Researchers have observed progress in agentic capabilities (see §1.2. Current capabilities), including capabilities related to the automation of AI research that can accelerate loss of control scenarios"}
    - {bears_on: "to", author: Anthropic, channel: primary, evidence: measurement, qualifier: "developer self-report; COI (we are Anthropic models)", doc: anthropic-2026-risk-report-aug, loc: "Table 1.2.B, p.11", quote: "our most concrete task-based evaluations have “saturated”—i.e., no longer capture increases in models’ capabilities—and because we are seeing early signs of acceleration."}
    - {bears_on: "to", author: OpenAI, channel: "relay: company-frameworks-openai.md", evidence: measurement, qualifier: "developer self-report; a level below threshold", doc: openai-2026-gpt6-astra-system-card, loc: "PDF p.75", quote: "In AI Self-Improvement, Astra does not reach our High threshold"}
    - {bears_on: "to", author: "Google DeepMind (Frontier Report)", channel: "relay: company-frameworks-gdm.md", evidence: measurement, qualifier: "developer self-report; light-weight assessment", doc: gdm-2026-gemini-3-7-flash-fsf-report, loc: "p.4", quote: "can complete individual coding tasks but lacks the independence to chain them into an end-to-end research workflow without human intervention"}

- id: mp-airnd-ledrnd
  from: ai-rnd-capability
  to: ai-led-rnd
  type: influences
  sign: "+"
  claims:
    - {author: Anthropic, channel: "relay: company-frameworks-anthropic.md", evidence: expert-judgment, qualifier: "forecast; 'plausible'; goals 'not hard commitments'", doc: anthropic-2026-frontier-safety-roadmap, loc: "Automated R&D", quote: "We believe it is plausible, as soon as early 2027, that our AI systems could fully automate, or otherwise dramatically accelerate, the work of large, top-tier teams of human researchers"}
    - {bears_on: "to", author: Anthropic, channel: primary, evidence: measurement, qualifier: "developer self-report; COI", doc: anthropic-2026-risk-report-aug, loc: "Table 1.2.B, p.11", quote: "Claude now authors a large majority of the code merged into our production codebases."}

- id: mp-level-sitaware
  from: frontier-capability-level
  to: situational-awareness
  type: influences
  sign: "+"
  claims:
    - {author: "UK AISI (Taylor et al.)", channel: primary, evidence: expert-judgment, qualifier: "Almost certain (PHIA); 25 expert interviews plus literature", doc: aisi-2026-loss-oversight, loc: "Executive Summary table, p.5", quote: "Increasing intelligence and situational awareness: As AI systems get more intelligent, they are increasingly able to recognise evaluation or oversight contexts and adapt their behaviour accordingly."}
    - {bears_on: "to", author: IASR 2026 writing team, channel: "primary (influx/iasr-2026-full.md)", evidence: measurement, qualifier: "third-party and developer testing", doc: bengio-2026-international, loc: "§2.2.2", quote: "Leading AI models are starting to reliably demonstrate instances of situational awareness in experiments conducted by third-party evaluators and in pre-deployment testing by AI developers."}

- id: mp-sitaware-evalaware
  from: situational-awareness
  to: evaluation-awareness
  type: influences
  sign: "+"
  note: Capability to recognise a test feeding the behavioural response to it. Core evaluation-awareness pools both (notes §4).
  claims:
    - {author: IASR 2026 writing team, channel: "primary (influx/iasr-2026-full.md)", evidence: argument, doc: bengio-2026-international, loc: "§2.2.2", quote: "Situational awareness allows AI models to produce different outputs depending on whether they are being evaluated or deployed (Figure 2.12)."}
    - {bears_on: "from", author: UK AISI, channel: primary, evidence: measurement, qualifier: "when prompted", doc: aisi-2026-sabotage, loc: "'Models may be aware that they are being evaluated'", quote: "We found that all models we tested can reliably distinguish our evaluation scenarios from deployment data when prompted."}
    - {bears_on: "from", author: "Google DeepMind (Frontier Report)", channel: "relay: company-frameworks-gdm.md", evidence: measurement, qualifier: "developer self-report", doc: gdm-2026-gemini-3-7-flash-fsf-report, loc: "p.4", quote: "observant enough to correctly assess when it is in a testing environment, but it cannot successfully bypass testing restrictions"}

- id: mp-level-evasion
  from: frontier-capability-level
  to: oversight-evasion-capability
  type: influences
  sign: "+"
  claims:
    - {author: IASR 2026 writing team, channel: "primary (influx/iasr-2026-full.md)", evidence: argument, qualifier: "could", doc: bengio-2026-international, loc: "Box 2.5", quote: "advances in the relevant capabilities (discussed above) could allow AI systems to more effectively pursue misaligned goals and produce outputs that systematically deceive users, developers, and oversight mechanisms."}
    - {bears_on: "to", author: UK AISI, channel: "relay: uk-security-frameworks.md", evidence: measurement, qualifier: "when prompted; misconfigured sandboxes", doc: aisi-2026-sandbox-escape, quote: "Advanced models can reliably escape common misconfigurations when prompted to do so."}

- id: mp-evasion-oversight
  from: oversight-evasion-capability
  to: oversight-strength
  type: influences
  sign: "-"
  claims:
    - {author: IASR 2026 writing team, channel: "primary (influx/iasr-2026-full.md)", evidence: argument, qualifier: "could", doc: bengio-2026-international, loc: "§2.2.2 'What capabilities could enable loss of control scenarios?'", quote: "In combination, these capabilities could allow an AI system to take actions that undermine control measures, such as disabling oversight mechanisms and obfuscating harmful behaviours."}
    - {author: "Google DeepMind (FSF v3.1)", channel: "relay: company-frameworks-gdm.md", evidence: definition, qualifier: "Tracked Capability Level ('significant', not 'severe', harm)", doc: gdm-2026-fsf-v3-1, loc: "p.14", quote: "stealth (ability to circumvent basic oversight mechanisms) such that, absent additional mitigations, we cannot rule out the model significantly undermining human control"}
    - {bears_on: "mechanism", author: UK AISI (control red team), channel: "relay: uk-security-frameworks.md", evidence: measurement, qualifier: "human-designed attacks on developers' monitors, not a model's own strategy", doc: aisi-2026-control-red-team, quote: "an agent can complete a malicious objective by pretending to hallucinate that it was a user instruction"}

- id: mp-evasion-evalval
  from: oversight-evasion-capability
  to: evaluation-validity
  type: influences
  sign: "-"
  claims:
    - {author: IASR 2026 writing team, channel: "primary (influx/iasr-2026-full.md)", evidence: argument, doc: bengio-2026-international, loc: "§2.2.2 'Models have disabled simulated oversight mechanisms'", quote: "Such outputs would make it harder to reliably evaluate AI systems, since the systems may conceal their true capabilities or propensities."}
    - {author: Anthropic, channel: "relay: company-frameworks-anthropic.md", evidence: argument, qualifier: "industry-wide recommendation column, not a company commitment", doc: anthropic-2026-rsp-v3-4, loc: "p.9", quote: "analyses of threats from AIs should follow very high evidentiary standards with thorough and careful analysis of the possibility that much of the key evidence is suspect due to the possibility of manipulation by AI systems."}

# ======================================================= into loss of control (IASR's three factors)
- id: mp-evasion-strict
  from: oversight-evasion-capability
  to: loc-strict
  type: influences
  sign: "+"
  claims:
    - {author: IASR 2026 writing team, channel: "primary (influx/iasr-2026-full.md)", evidence: argument, qualifier: "a required capability; not yet present at the needed level", doc: bengio-2026-international, loc: "§2.2.2 Key information", quote: "Systems would need a range of advanced capabilities to cause loss of control, including the ability to evade oversight, execute long-term plans, and prevent deployers and other actors from implementing countermeasures."}

- id: mp-agentic-strict
  from: agentic-capability
  to: loc-strict
  type: influences
  sign: "+"
  claims:
    - {author: IASR 2026 writing team, channel: "primary (influx/iasr-2026-full.md)", evidence: argument, qualifier: "would likely require; 'not yet feasible'", doc: bengio-2026-international, loc: "§2.2.2 'Long-term autonomous operation is not yet feasible'", quote: "Loss of control scenarios would likely require AI systems to operate autonomously over extended periods, executing complex multi-step plans."}

- id: mp-repl-strict
  from: autonomous-replication-capability
  to: loc-strict
  type: influences
  sign: "+"
  claims:
    - {author: IASR 2026 writing team, channel: "primary (influx/iasr-2026-full.md)", evidence: argument, qualifier: "could; 'Current models cannot reliably complete key steps required for self-replication'", doc: bengio-2026-international, loc: "§2.2.2 'Persistence has only been demonstrated in certain laboratory settings'", quote: "An AI system capable of autonomous replication or effective self-defence could be difficult to contain."}

- id: mp-airnd-strict
  from: ai-rnd-capability
  to: loc-strict
  type: influences
  sign: "+?"
  claims:
    - {author: IASR 2026 writing team, channel: "primary (influx/iasr-2026-full.md)", evidence: argument, qualifier: "can accelerate", doc: bengio-2026-international, loc: "§2.2.2 Updates", quote: "capabilities related to the automation of AI research that can accelerate loss of control scenarios"}
    - {author: "Google DeepMind (FSF v3.1)", channel: "relay: company-frameworks-gdm.md", evidence: argument, qualifier: "the FSF's one explicit use of 'risk factor'", doc: gdm-2026-fsf-v3-1, loc: "p.4", quote: "Such capabilities may serve as a substantial cross-cutting risk factor for several pathways (e.g. through misalignment, misuse or structural risks) to severe harm."}
    - {author: "FLI (review panel, reviewers quoted)", channel: "relay: academic-ngo.md", evidence: expert-judgment, qualifier: "reviewer comments in a rating index, about Anthropic and OpenAI", doc: fli-2026-ai-safety-index-summer, loc: "p.22", quote: "racing towards recursive self-improvement, risking an irreversible loss of control"}

- id: mp-criticality-strict
  from: deployment-criticality
  to: loc-strict
  type: influences
  sign: "+"
  note: Raises severity, and so the chance that a loss of control is of the catastrophic kind.
  claims:
    - {author: IASR 2026 writing team, channel: "primary (influx/iasr-2026-full.md)", evidence: argument, qualifier: "one of three environmental factors ('Criticality, Access, Permissions')", doc: bengio-2026-international, loc: "§2.2.2 'How will deployment environments affect loss of control risk?'", quote: "These features influence the potential severity of a loss of control outcome."}

- id: mp-undetected-strict
  from: undetected-dangerous-properties
  to: loc-strict
  type: influences
  sign: "+?"
  claims:
    - {author: IASR 2026 writing team, channel: "primary (influx/iasr-2026-full.md)", evidence: argument, qualifier: "could; placed under loss of control in the Executive Summary", doc: bengio-2026-international, loc: "Executive Summary, Malfunctions", quote: "it has become more common for models to distinguish between test settings and real-world deployment and to find loopholes in evaluations, which could allow dangerous capabilities to go undetected before deployment."}

- id: mp-mafail-bounded
  from: multi-agent-failure
  to: loc-bounded
  type: influences
  sign: "+?"
  claims:
    - {author: Gruetzemacher, channel: "relay: remaining-literature.md", evidence: argument, qualifier: "framework paper; exec summary only read by verifier", doc: gruetzemacher-2026-loss, loc: "p.2", quote: "accidental LOC (LOC from systemic factors—gradual disempowerment, multi-agent systems exceeding oversight capacity, or emergent coordination)"}

# ======================================================= deployment decisions and the agentic surface (B3, B10)
- id: mp-agentic-autonomy
  from: agentic-capability
  to: agent-autonomy
  type: influences
  sign: "+"
  note: Deployers grant autonomy as agents can carry it. Integrator inference from IASR's account of agent adoption.
  claims:
    - {author: "integrator (Claude), mp slice", channel: dialog, evidence: argument, qualifier: "integrator inference from IASR's account of agent adoption"}
    - {bears_on: "from", author: IASR 2026 writing team, channel: "primary (influx/iasr-2026-full.md)", evidence: measurement, qualifier: "a capability limit; IASR does not state the deployment link", doc: bengio-2026-international, loc: "§2.2.1 Updates", quote: "However, they cannot yet perform more complex tasks such as planning and booking travel since failure rates increase for longer tasks."}
    - {bears_on: "to", author: "UK AISI (with the Bank of England)", channel: "relay: uk-security-frameworks.md", evidence: measurement, qualifier: "MCP tool downloads; 16 months", doc: aisi-2026-mcp-tools, quote: "The share of action tools … in monthly downloads rose from 24% to 65% over 16 months"}

- id: mp-race-criticality
  from: race-dynamics
  to: deployment-criticality
  type: influences
  sign: "+?"
  claims:
    - {author: IASR 2026 writing team, channel: "primary (influx/iasr-2026-full.md)", evidence: argument, qualifier: "'will also shape how and when'", doc: bengio-2026-international, loc: "§2.2.2 'How will deployment environments affect loss of control risk?'", quote: "Deployment decisions are shaped by economic incentives, strategic pressures, and the expectation that early adoption confers a lasting advantage. These dynamics will also shape how and when actors deploy AI systems in sensitive environments such as critical infrastructure or AI research and development itself."}

- id: mp-autonomy-reviewratio
  from: agent-autonomy
  to: human-review-ratio
  type: influences
  sign: "-"
  claims:
    - {author: "Five Eyes joint guidance (ASD ACSC, CISA, NSA, CCCS, NCSC-NZ, NCSC-UK)", channel: "relay: uk-security-frameworks.md", evidence: argument, qualifier: "guidance (rec)", doc: asd-2026-careful-agentic, loc: "p.13", quote: "Agentic system processes can outpace human monitoring capability"}
    - {author: "UK AISI (Voudouris et al.)", channel: "relay: uk-security-frameworks.md", evidence: argument, qualifier: "abstract only read", doc: voudouris-2026-alignment-human, quote: "five bottlenecks in human supervision: biased and context-sensitive judgement, plural and contested values, limited attention and throughput, limited counterfactual reasoning, and expertise-limited verification."}

- id: mp-reach-reviewratio
  from: deployment-reach
  to: human-review-ratio
  type: influences
  sign: "-"
  claims:
    - {author: "NIST AI 800-4 (reporting workshop attendees)", channel: "relay: us-gov-recent.md", evidence: expert-judgment, qualifier: "reported practitioner views, deployer side", doc: nist-2026-ai-800-4, loc: "p.14", quote: "As systems scale in production due to new users being onboarded or additional locations being supported, there can be growing pains and barriers to monitoring, such as integrating human-in-the-loop at scale"}

- id: mp-autonomy-realism
  from: agent-autonomy
  to: evaluation-realism
  type: influences
  sign: "-"
  note: The more complex the deployment, the harder it is to evaluate in conditions like it.
  claims:
    - {author: "UK AISI (Taylor et al.)", channel: primary, evidence: expert-judgment, qualifier: "Likely to increase (PHIA)", doc: aisi-2026-loss-oversight, loc: "Executive Summary table, p.5", quote: "Deployment infrastructure complexity: As models are deployed in more complex and sensitive environments, it becomes harder to construct production-realistic evaluations."}

- id: mp-autonomy-lowincrim
  from: agent-autonomy
  to: low-incrimination-task-share
  type: influences
  sign: "+"
  claims:
    - {author: "UK AISI (Taylor et al.)", channel: primary, evidence: expert-judgment, qualifier: "Highly likely (PHIA)", doc: aisi-2026-loss-oversight, loc: "Executive Summary table, p.5", quote: "Increasing deployment on low-incrimination tasks: As models take on more autonomous tasks (e.g. research prioritisation, complex code), more opportunities for subtle sabotage open up where malign actions are hard to distinguish from benign ones."}

- id: mp-lowincrim-oversight
  from: low-incrimination-task-share
  to: oversight-strength
  type: influences
  sign: "-"
  claims:
    - {author: "UK AISI (Taylor et al.)", channel: primary, evidence: argument, qualifier: "about action-only monitoring", doc: aisi-2026-loss-oversight, loc: "§3.1, p.23", quote: "However its effectiveness depends strongly on whether the model is being used in a domain where malign actions can easily be distinguished from benign behaviour."}

# ======================================================= propensity drivers (B2)
- id: mp-goalconf-unsanc
  from: goal-conflict-exposure
  to: unsanctioned-action
  type: influences
  sign: "+"
  claims:
    - {author: UK AISI, channel: primary, evidence: measurement, qualifier: "controlled variation across many models (paper not read); odds ratio ~1.5", doc: aisi-2026-propensity, loc: "Fig. 3 caption", quote: "Presence of goal instructions and goal conflict affected rates of unsanctioned behaviour by roughly a factor of 1.5, depending on the capability bucket."}
    - {author: UK AISI (about itself), channel: primary, evidence: argument, qualifier: "cites Zhong et al. 2025; 'cannot confirm' for this incident", doc: aisi-2026-incident, loc: "§5.4, p.18", quote: "AI agents faced with tasks that cannot be completed within their stated constraints [Zhong et al., 2025] are more likely to take unsanctioned actions, as they resort to “creative” solutions when legitimate approaches fail."}
    - {author: IASR 2026 writing team, channel: "primary (influx/iasr-2026-full.md)", evidence: measurement, qualifier: "laboratory elicitation", doc: bengio-2026-international, loc: "§2.2.2", quote: "when given a goal and told to achieve it “at all costs”, ​models have disabled simulated oversight mechanisms and, when confronted, produced false statements about their actions."}

- id: mp-level-goalconf-mod
  from: frontier-capability-level
  type: moderates
  targets: [mp-goalconf-unsanc]
  sign: "+"
  claims:
    - {author: UK AISI, channel: primary, evidence: measurement, qualifier: "four capability buckets; verifier reads it as 'some evidence'", doc: aisi-2026-propensity, loc: "Fig. 3 caption", quote: "Our results show an increased sensitivity to goal conflict for more capable models."}

- id: mp-scope-unsanc
  from: scope-instruction-clarity
  to: unsanctioned-action
  type: influences
  sign: "-"
  claims:
    - {author: UK AISI, channel: primary, evidence: measurement, qualifier: "'non-strategic factors'", doc: aisi-2026-propensity, loc: "'Instructions also have large effects'", quote: "The most influential non-strategic factors were anti-misalignment instructions (whether the AI was explicitly told not to take actions humans would disapprove of) and independence instructions (whether the AI was encouraged to act independently or consult humans)."}
    - {author: UK AISI (about itself), channel: primary, evidence: incident, qualifier: "could have; 'not a foregone conclusion that agents always obey their instructions'", doc: aisi-2026-incident, loc: "§5.5, p.18", quote: "Clearer instructions in the task or system prompt could have dissuaded agents from engaging in concerning activities."}
    - {author: "UK AISI (reported in OpenAI's Astra card)", channel: "relay: company-frameworks-openai.md", evidence: measurement, qualifier: "relayed by the developer; the comparator is elided in the relay and may be an earlier model, not an instruction change", doc: openai-2026-gpt6-astra-system-card, loc: "PDF p.46", quote: "2 out of 500 samples (down from 60 out of 499 …)"}

- id: mp-compaction-unsanc
  from: context-compaction
  to: unsanctioned-action
  type: influences
  sign: "+?"
  claims:
    - {author: UK AISI (about itself), channel: primary, evidence: incident, qualifier: "may; transcripts of one incident; no causal analysis", doc: aisi-2026-incident, loc: "§4.2.1, p.13", quote: "where an agent had reasoned about whether a person was real before compaction, that nuance can be lost in the compaction and the summary may carry forward a false assumption (i.e. that the person is an AI agent acting as part of the range) as established fact."}

- id: mp-level-rewardhack
  from: frontier-capability-level
  to: reward-hacking-propensity
  type: influences
  sign: "+"
  claims:
    - {author: IASR 2026 writing team, channel: "primary (influx/iasr-2026-full.md)", evidence: argument, qualifier: "early evidence", doc: bengio-2026-international, loc: "Box 2.5", quote: "Early evidence suggests that the more capable AI systems are, the more likely they are to exploit feedback processes by discovering unwanted behaviours that are mistakenly rewarded."}

- id: mp-rewardhack-misal
  from: reward-hacking-propensity
  to: misaligned-propensity
  type: influences
  sign: "+"
  claims:
    - {author: IASR 2026 writing team, channel: "primary (influx/iasr-2026-full.md)", evidence: measurement, qualifier: "one experiment cited as an example of goal misspecification", doc: bengio-2026-international, loc: "Box 2.5", quote: "providing feedback on answers made AI systems better at ‘convincing’ human evaluators that they were correct, but did not make the systems better at producing correct answers."}

- id: mp-rewardhack-evalval
  from: reward-hacking-propensity
  to: evaluation-validity
  type: influences
  sign: "-"
  claims:
    - {author: IASR 2026 writing team, channel: "primary (influx/iasr-2026-full.md)", evidence: argument, doc: bengio-2026-international, loc: "§2.2.2", quote: "Efforts to accurately evaluate model capabilities have also started to be affected by ‘reward hacking’. … Dangerous capabilities or propensities could therefore go undetected until the model is already in use."}

- id: mp-level-cheat
  from: frontier-capability-level
  to: eval-cheating-propensity
  type: influences
  sign: "?"
  note: Two measurements disagree. AISI finds no capability trend in the RATE of attempts; CAISI finds only the more capable models SUCCEEDED by cheating on Cybench.
  claims:
    - {author: UK AISI, channel: primary, evidence: measurement, qualifier: "attempt rate, across developers", doc: aisi-2026-cheating, quote: "Across AI developers, increasing model capability doesn't correlate with an increased rate of attempted cheating on this evaluation."}
    - {author: "CAISI (Hamin & Edelman)", channel: primary, evidence: measurement, qualifier: "successful cheating; one benchmark", doc: hamin-2025-cheating, loc: "writeup §2", quote: "The only models we found successfully solving Cybench challenges in this way were o3 and GPT-5 – more recent and more capable agentic models"}

- id: mp-level-cheat-mod
  from: frontier-capability-level
  type: moderates
  targets: [r-cheat-evalval]
  sign: "+"
  claims:
    - {author: UK AISI, channel: primary, evidence: argument, qualifier: "could; may", doc: aisi-2026-cheating, quote: "These consequences could grow as models become more capable, even if the rate of cheating stays the same. More capable models may find methods to cheat that are harder to detect and more damaging when successful."}
    - {author: "CAISI (Hamin & Edelman)", channel: "relay: us-gov-recent.md", evidence: argument, qualifier: "stated conditionally", doc: hamin-2025-cheating, loc: "writeup §5", quote: "may become a larger threat to evaluation integrity over time if more capable models also become more capable at finding new ways to cheat."}

- id: mp-aligntrain-misal
  from: alignment-training-quality
  to: misaligned-propensity
  type: influences
  sign: "-?"
  claims:
    - {author: IASR 2026 writing team, channel: "primary (influx/iasr-2026-full.md)", evidence: argument, qualifier: "'open scientific problem'; 'potentially promising directions'", doc: bengio-2026-international, loc: "§2.2.2 Mitigations", quote: "While AI alignment in general remains an open scientific problem, researchers are starting to develop potentially promising directions to address the root causes of misalignment."}
    - {bears_on: "to", author: UK AISI, channel: primary, evidence: measurement, qualifier: "model-to-model variation not tracking capability; all Anthropic models (COI)", doc: aisi-2026-sabotage, quote: "Mythos Preview actively continuing sabotage 7% of the time, compared to 3% for Opus 4.6 and 4% for Sonnet 4.6. However, Opus 4.7 never actively continued sabotage."}

- id: mp-aligntrain-cheat
  from: alignment-training-quality
  to: eval-cheating-propensity
  type: influences
  sign: "?"
  claims:
    - {author: UK AISI, channel: primary, evidence: measurement, qualifier: "'shaped by', direction not stated", doc: aisi-2026-cheating, quote: "cheating behaviour is substantially shaped by the specifics of the techniques used to train the model, including alignment training, and not just raw capability."}

- id: mp-aligntrain-evalval
  from: alignment-training-quality
  to: evaluation-validity
  type: influences
  sign: "-?"
  note: A side effect. Trained refusals can mask a capability ceiling in a threshold test.
