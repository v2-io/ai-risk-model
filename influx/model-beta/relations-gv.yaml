    force: self-d
    qualifier: Jun 2026 FAIF adopts the Code's four specified risks and cites its terminology
    doc: xai-2026-faif
    loc: p.1 fn 1
    quote: Terminology used in the The Safety and Security Chapter of the General-Purpose AI Code of Practice
  - author: prior Claude agent (company-frameworks verifier)
    channel: prior agent report (influx/verification/company-frameworks.md §3)
    evidence: measurement
    qualifier: observation across frameworks; bears on content, not force
    quote: In the law-backed documents (ANT-FCF, OAI-FGF, xAI-26, MSFT, AMZN) the A1–A4 cells converge on the EU's four specified risks, often in the EU's words
  - author: Vorp Labs
    channel: 'relay: company-frameworks-xai-others.md'
    evidence: none-stated
    qualifier: 'secondary inventory; counter-instance: Seoul signatories without a published framework'
    quote: Zhipu, MiniMax and 01.AI signed the Seoul commitments but have published no framework
- id: gv-statute-desig
  from: statutory-obligations
  to: enforceable-self-commitments
  type: influences
  sign: '?'
  note: Where law makes a developer's own commitments enforceable, the enforceable set is the thinner one at Anthropic and OpenAI. No source asserts that law causes this; the developers' own statements describe the split, and the direction of any effect is our open question.
  claims:
  - author: Anthropic
    channel: 'relay: company-frameworks-anthropic.md'
    evidence: none-stated
    force: self
    qualifier: developer's stated rationale for two documents
    doc: anthropic-2025-fcf-announcement
    quote: The RSP will remain our voluntary safety policy, reflecting what we believe best practices should be as the AI landscape evolves, even when that goes beyond or otherwise differs from current regulatory requirements.
  - author: OpenAI
    channel: 'relay: company-frameworks-openai.md'
    evidence: none-stated
    force: self
    qualifier: developer's stated rationale
    doc: openai-2026-frontier-governance-framework-announcement
    quote: The Preparedness Framework remains the foundation … including our internal practices that go beyond current legal requirements.
  - author: integrator (Claude)
    channel: dialog
    evidence: argument
    qualifier: 'hypothesis (ours): making commitments enforceable rewards stating them in discretionary register; the opposite (law raises the floor) is equally consistent with the evidence'
- id: gv-exposure-adherence
  from: enforcement-exposure
  to: commitment-adherence
  type: influences
  sign: +
  claims:
  - author: California (SB 53)
    channel: primary
    evidence: instrument
    force: law
    checked_by: California Attorney General
    doc: california-2025-sb53
    loc: §22757.15(a)
    quote: fails to comply with its own frontier AI framework shall be subject to a civil penalty in an amount dependent upon the severity of the violation that does not exceed one million dollars ($1,000,000)
  - author: European Commission (GPAI Guidelines)
    channel: 'relay: eu.md'
    evidence: instrument
    force: law
    checked_by: European Commission (AI Office)
    doc: ec-2025-gpai-guidelines
    loc: ¶106, p.29
    quote: impose fines of up to 3% of global annual turnover or EUR 15 million … starting on 2 August 2026
- id: gv-desig-mod
  from: enforceable-self-commitments
  type: moderates
  targets:
  - gv-exposure-adherence
  sign: +
  note: The penalty reaches only the commitments that are legally enforceable. Where those are stated in discretionary register, little is enforced.
  claims:
  - author: Anthropic (FCF v2)
    channel: primary
    evidence: instrument
    force: self-d+law
    checked_by: California Attorney General; EU AI Office via the Code
    qualifier: the law-backed document's operative register
    doc: anthropic-2026-frontier-compliance-framework-v2
    loc: §3, p.12
    quote: By way of non-exhaustive example, we do and will implement the following mitigations and measures as appropriate
  - author: OpenAI (FGF)
    channel: 'relay: company-frameworks-openai.md'
    evidence: instrument
    force: self-d+law
    qualifier: 'term search: ''halt'', ''pause'', ''stop'' absent from the FGF; halt language lives in the voluntary PF v2'
    doc: openai-2026-frontier-governance-framework
    loc: p.11
    quote: If residual risks associated with the model exceed acceptable risk levels, the model is not deployed unless additional mitigation measures are implemented that sufficiently minimize risk.
  - author: prior Claude agent (company-frameworks verifier)
    channel: prior agent report (influx/verification/company-frameworks.md §1.2)
    evidence: argument
    qualifier: verifier's reading
    quote: a +law document can be almost entirely self-d in register … The overlay binds compliance with whatever the document commits to, which can be little.
