# Governance, commitments and enforcement slice: relations (ids gv-*). Generated from Python data for reliable quoting.
# Claim fields as in SCHEMA.md, plus two PROPOSED optional fields (check.py ignores them; see notes-gv.md §3):
#   force       the force of the DOCUMENT the claim cites: law · commit · exec · self · self-d · rec · bench · crit · prop · draft · desc,
#               with overlays for designated frameworks, e.g. "self-d+law" (a developer's own text, in discretionary register, that a statute binds it to comply with)
#   checked_by  who can actually enforce or check it (e.g. "California Attorney General", "European Commission (AI Office)"); absent = no one named
# `gv-i-*` relations are `indicates` relations (the core uses `i-*`).
- id: gv-statute-partof-regreq
  from: statutory-obligations
  to: regulatory-requirements
  type: part_of
  note: The core regulatory-requirements pools law and signatory commitments. These two part_of links make the pooling explicit without editing the core.
  claims:
  - author: integrator (Claude)
    channel: dialog
    evidence: definition
    qualifier: this slice's decomposition of the core concept's own definition ('statute, binding commitments, enforceable reporting')
- id: gv-code-partof-regreq
  from: code-commitments
  to: regulatory-requirements
  type: part_of
  claims:
  - author: EU GPAI Code (signatories)
    channel: 'relay: eu.md'
    evidence: definition
    force: commit
    qualifier: voluntary; one route to demonstrating compliance with binding Art. 55
    doc: eu-cop-2025-safety-security
    loc: Objective A, p.2
    quote: to serve as a guiding document for demonstrating compliance … while recognising that adherence to the Code does not constitute conclusive evidence of compliance
  - author: European Union (Digital Omnibus on AI)
    channel: 'relay: remaining-literature.md'
    evidence: instrument
    force: law
    qualifier: recital; limits the legal effect of the part
    doc: eu-2026-digital-omnibus-ai
    loc: recital 41, p.13
    quote: do not grant a presumption of conformity
- id: gv-pause-partof-self
  from: pause-commitments
  to: self-commitments
  type: part_of
  claims:
  - author: IASR 2026 writing team
    channel: primary (ref/iasr-2026-full.md)
    evidence: definition
    qualifier: descriptive
    doc: bengio-2026-international
    loc: §3.2
    quote: they vary in their definitions of risk tiers and thresholds … and the comprehensiveness of their mitigation commitments (for example, whether they include deleting model weights versus just pausing development)
- id: gv-statute-code
  from: statutory-obligations
  to: code-commitments
  type: influences
  sign: +
  note: The Code exists to operationalize Art. 55; law gives the voluntary layer its point.
  claims:
  - author: European Union (AI Act)
    channel: 'relay: eu.md'
    evidence: instrument
    force: law
    checked_by: European Commission (AI Office)
    doc: eu-2024-ai-act
    loc: Art. 55(2), p.86
    quote: may rely on codes of practice … to demonstrate compliance … until a harmonised standard is published
  - author: European Commission (GPAI Guidelines)
    channel: 'relay: eu.md'
    evidence: instrument
    force: law
    qualifier: official guidance
    doc: ec-2025-gpai-guidelines
    loc: ¶100, p.27
    quote: A code of practice is a temporary tool … As opposed to adherence to a code of practice, compliance with harmonised standards grants a presumption of conformity
- id: gv-statute-self
  from: statutory-obligations
  to: self-commitments
  type: influences
  sign: +
  note: Law requires developers to write, publish and comply with a framework, and pulls statutory content into voluntary texts too. See gv-statute-desig for the counter-movement.
  claims:
  - author: California (SB 53)
    channel: primary
    evidence: instrument
    force: law
    checked_by: California Attorney General
    doc: california-2025-sb53
    loc: §22757.12(a)
    quote: A large frontier developer shall write, implement, comply with, and clearly and conspicuously publish … a frontier AI framework
  - author: Microsoft
    channel: 'relay: company-frameworks-meta-msft-amzn.md'
    evidence: document-change
    force: self
    qualifier: the developer's own account of why it revised
    doc: microsoft-2026-frontier-governance-framework
    loc: change log, p.15
    quote: One year update following finalization of the EU Code of Practice for General Purpose AI (CoP), NY RAISE Act and CA Transparency in Frontier Artificial Intelligence Act
  - author: Meta
    channel: 'relay: company-frameworks-meta-msft-amzn.md'
    evidence: document-change
    force: self
    qualifier: content maps onto SB 53 element by element without citing it (verifier's inference); change log lists the additions
    doc: meta-2026-advanced-ai-scaling-framework
    loc: p.44
    quote: Added Loss of Control as a risk domain
- id: gv-code-self
  from: code-commitments
  to: self-commitments
  type: influences
  sign: +
  claims:
  - author: IASR 2026 writing team
