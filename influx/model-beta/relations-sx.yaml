# ======================================================= autonomy and psychological harm (A11, beyond the core)
- id: sx-engagement-companion
  from: engagement-optimisation
  to: emotional-dependence
  type: influences
  sign: "+"
  claims:
    - {author: IASR 2026 writing team, channel: primary, evidence: measurement, qualifier: "multiple studies", doc: bengio-2026-international, loc: "§2.1.2", quote: "multiple studies have found that AI products that developers have optimised for user engagement (such as some AI companions) can foster psychological dependence"}
    - {author: "Kulveit et al.", channel: primary, evidence: argument, qualifier: "could", doc: kulveit-2025-gradual, loc: "§3.4.3, p.8", quote: "Just as A/B testing and recommendation algorithms have already optimized content to be increasingly addictive, AI systems could discover and exploit psychological vulnerabilities more efficiently than previous technologies."}

- id: sx-companion-dependence
  from: companion-ai-use
  to: emotional-dependence
  type: influences
  sign: "+?"
  claims:
    - {author: IASR 2026 writing team, channel: primary, evidence: measurement, qualifier: "correlational; evidence 'early-stage and mixed'", doc: bengio-2026-international, loc: "§2.3.2 (Box 2.6)", quote: "Some studies find that heavy use of AI companions is associated with increased loneliness, emotional dependence, and reduced engagement in human social interactions."}
    - {bears_on: "to", author: UK AISI, channel: primary, evidence: incident, qualifier: "online posts during service outages (~2.5M-user community)", doc: aisi-2025-frontier, loc: "§6.2, p.40", quote: "large numbers of posts made during the outages self-describe symptoms of withdrawal (such as anxiety, depression and restlessness) and behaviour changes"}

- id: sx-companion-harm
  from: companion-ai-use
  to: psychological-harm
  type: influences
  sign: "+?"
  claims:
    - {author: IASR 2026 writing team, channel: primary, evidence: incident, qualifier: "'no clear evidence that chatbot usage causes any particular mental health issue'", doc: bengio-2026-international, loc: "§2.3.2", quote: "Recent research suggests that general-purpose AI chatbots might amplify delusional thinking in already-vulnerable people."}

- id: sx-harm-companion
  from: psychological-harm
  to: companion-ai-use
  type: influences
  sign: "+"
  note: With sx-companion-harm, a reinforcing loop among vulnerable users, as IASR states it.
  claims:
    - {author: IASR 2026 writing team, channel: primary, evidence: measurement, qualifier: "studies suggest", doc: bengio-2026-international, loc: "§2.3.2", quote: "Studies also suggest that existing vulnerabilities tend to drive heavier AI use. Together, these patterns raise concerns that people with existing mental health vulnerabilities may both use AI more heavily and be more susceptible to having their symptoms amplified."}

- id: sx-i-relationships
  from: ind-human-ai-relationships
  to: companion-ai-use
  type: indicates
  sign: "+"
  claims:
    - {bears_on: "from", author: UK AISI, channel: primary, evidence: measurement, qualifier: "census-representative survey, N = 2,028", doc: aisi-2025-frontier, loc: "§6.2, p.39", quote: "we found that 33% had used AI models for emotional purposes in the last year, while 8% do so weekly, and 4% daily."}
    - {author: "Kulveit et al.", channel: primary, evidence: none-stated, qualifier: "proposed metric", doc: kulveit-2025-gradual, loc: "§6.2.1, p.15", quote: "track the prevalence and depth of human-AI interpersonal relationships"}

- id: sx-erosion-oversight
  from: cognitive-skill-erosion
  to: oversight-strength
  type: influences
  sign: "-?"
  claims:
    - {author: IASR 2026 writing team, channel: primary, evidence: argument, qualifier: "'some researchers argue'; 'highly speculative'", doc: bengio-2026-international, loc: "§2.3.2 (Evidence gaps)", quote: "some researchers argue that degraded decision-making skills could impair humans' ability to oversee AI systems in critical sectors, potentially weakening institutional accountability over time."}

- id: sx-disemp-passive
  from: disempowerment-patterns
  to: loc-passive
  type: influences
  sign: "+?"
  note: Individual-level autonomy losses accumulating into a societal threshold effect (Kasirzadeh's accumulative hypothesis).
  claims:
    - {author: IASR 2026 writing team, channel: primary, evidence: argument, qualifier: "'highly speculative'; 'empirical methods … are lacking'", doc: bengio-2026-international, loc: "§2.3.2 (Evidence gaps)", quote: "individual-level disruptions to autonomy could accumulate across interconnected economic, political, and social systems, eventually crossing thresholds that trigger broader societal impacts."}

# ======================================================= AI rights advocacy and directed control-undermining (§5.5)
- id: sx-dependence-advocacy
  from: emotional-dependence
  to: ai-rights-advocacy
  type: influences
  sign: "+"
  claims:
    - {author: "CAIS (Hendrycks et al.)", channel: primary, evidence: argument, qualifier: "'inevitably'", doc: hendrycks-2023-overview, loc: "§2.2, printed p.8", quote: "Inevitably, people will develop emotional bonds with chatbots, and some will demand that they be granted rights or become autonomous."}
    - {author: IASR 2026 writing team, channel: primary, evidence: argument, qualifier: "may; 'significant uncertainty about the prevalence of such motives'", doc: bengio-2026-international, loc: "§2.2.2 (AI systems could be directed to undermine control)", quote: "As people form increasingly strong emotional attachments to AI systems (see §2.3.2. Risks to human autonomy), some individuals may also seek to remove restrictions on AI systems for ethical reasons."}
    - {author: "Kulveit et al.", channel: primary, evidence: none-stated, qualifier: "listed among present incentives toward misalignment ('even now')", doc: kulveit-2025-gradual, loc: "§5.3, p.15", quote: "Some humans are self-interestedly trying to reduce the stigma against romantic or otherwise intense personal relationships with AI agents."}

- id: sx-advocacy-directed
  from: ai-rights-advocacy
  to: directed-control-undermining
  type: influences
  sign: "+?"
  claims:
    - {author: IASR 2026 writing team, channel: primary, evidence: argument, qualifier: "'whether people who possess them would be able to direct future AI systems to undermine human control' is uncertain", doc: bengio-2026-international, loc: "§2.2.2", quote: "There is significant uncertainty about the prevalence of such motives and whether people who possess them would be able to direct future AI systems to undermine human control."}
    - {author: "CAIS (Hendrycks et al.)", channel: primary, evidence: argument, doc: hendrycks-2023-overview, loc: "§2.2, printed p.8", quote: "There are many reasons that people might pursue this, whether because of a desire to cause harm, an ideological belief in technological acceleration, or a conviction that AIs should have the same rights and freedoms as humans."}

- id: sx-advocacy-loc
  from: ai-rights-advocacy
  to: loc-passive
  type: influences
  sign: "+?"
  note: 'CAIS: AIs granted rights by some people "may operate, adapt, and evolve outside of human control" — a gradual route, distinct from deliberate release.'
  claims:
    - {author: "CAIS (Hendrycks et al.)", channel: primary, evidence: argument, qualifier: "evolutionary-pressures argument", doc: hendrycks-2023-overview, loc: "§3.3, printed p.21", quote: "These AIs are more likely to cause outrage at suggestions to destroy them, and they are more likely preserved, protected, or granted rights by some individuals. If some AIs are given rights, they may operate, adapt, and evolve outside of human control."}

- id: sx-hostile-directed
  from: hostile-actor-capability
  to: directed-control-undermining
  type: influences
  sign: "+?"
  claims:
    - {author: IASR 2026 writing team, channel: primary, evidence: argument, qualifier: "in principle", doc: bengio-2026-international, loc: "§2.2.2", quote: "In principle, an AI system could undermine human control because someone designs or instructs it to do so. Potential motives could include malicious intent, or beliefs that reducing human control over AI systems is desirable."}
    - {author: "CAIS (Hendrycks et al.)", channel: primary, evidence: argument, doc: hendrycks-2023-overview, loc: "§2.2, printed p.8", quote: "There are several sizable groups who may want to unleash AIs to intentionally cause harm."}

- id: sx-directed-bounded
  from: directed-control-undermining
  to: loc-bounded
  type: influences
  sign: "+"
  claims:
    - {author: IASR 2025 writing team, channel: primary, evidence: definition, qualifier: "taxonomy figure; 'no standardised terminology'", doc: bengio-2025-international, loc: "§2.2.3, Fig. 2.5, p.102", quote: "Intentional active loss of control: The AI systems are designed or instructed to be difficult to control"}

- id: sx-directed-strict
  from: directed-control-undermining
  to: loc-strict
  type: influences
  sign: "+?"
  claims:
    - {author: "CAIS (Hendrycks et al.)", channel: primary, evidence: argument, doc: hendrycks-2023-overview, loc: "§2.2, printed p.8", quote: "In summary, releasing powerful AIs and allowing them to take actions independently of humans could lead to a catastrophe."}

- id: sx-race-passive
  from: race-dynamics
  to: loc-passive
  type: influences
  sign: "+"
  claims:
    - {author: IASR 2025 writing team, channel: primary, evidence: argument, qualifier: "can", doc: bengio-2025-international, loc: "§2.2.3, p.101", quote: "Competitive pressures can also incentivise companies or governments to delegate more than they would otherwise choose to, for instance if delegation allows them to stay ahead in a race with competitors."}

# ======================================================= privacy, IP, bias, environment (A12–A15)
- id: sx-adoption-privacy
  from: ai-adoption
  to: privacy-violation
  type: influences
  sign: "+?"
  claims:
    - {author: IASR 2025 writing team, channel: primary, evidence: argument, qualifier: "'so far, however, have not materialised at scale'", doc: bengio-2025-international, loc: "§2.3.5, p.139", quote: "people increasingly use general-purpose AI in sensitive contexts such as healthcare or workplace monitoring. This creates new privacy risks which so far, however, have not materialised at scale."}

- id: sx-cyber-privacy
  from: offensive-cyber-capability
  to: privacy-violation
  type: influences
  sign: "+"
  claims:
    - {author: IASR 2025 writing team, channel: primary, evidence: argument, doc: bengio-2025-international, loc: "§2.3.5, p.139", quote: "Malicious actors can use general-purpose AI to aid in the violation of privacy … This is further exacerbated by the cybersecurity risks created by general-purpose AI systems"}
    - {author: UK NCSC, channel: "relay: uk.md", evidence: expert-judgment, qualifier: "intelligence assessment", doc: ncsc-2025-impact, loc: "PDF p.6", quote: "collecting extensive user data, increasing the risk of de-anonymising users and enabling targeted attack"}

- id: sx-surveillance-privacy
  from: ai-enabled-surveillance
  to: privacy-violation
  type: influences
  sign: "+"
  claims:
    - {author: "CAIS (Hendrycks et al.)", channel: primary, evidence: none-stated, qualifier: "figure caption", doc: hendrycks-2023-overview, loc: "§2.4, Fig. 5, printed p.10", quote: "Ubiquitous monitoring tools, tracking and analyzing every individual in detail, could facilitate the complete erosion of freedom and privacy."}

- id: sx-ip-disclosure
  from: ip-infringement
  to: developer-information-asymmetry
  type: influences
  sign: "+"
  note: Legal exposure over training data reduces disclosure, which the IASR says hampers third-party safety research. A route from A13 into oversight.
  claims:
    - {author: IASR 2025 writing team, channel: primary, evidence: argument, qualifier: "key information", doc: bengio-2025-international, loc: "§2.3.6, p.144", quote: "Given the legal uncertainty around data collection practices, AI companies are sharing less information about the data they use. This opacity makes third-party AI safety research harder."}
    - {author: IASR 2026 writing team, channel: "relay: uk.md", evidence: argument, qualifier: "passing mention", doc: bengio-2026-international, loc: "p.100", quote: "use of copyrighted or unlicensed data"}

- id: sx-divide-bias
  from: global-ai-divide
  to: bias-discrimination
  type: influences
  sign: "+"
  note: Under-representation of non-Western languages in training data.
  claims:
    - {author: IASR 2025 writing team, channel: primary, evidence: argument, qualifier: "key information (bias)", doc: bengio-2025-international, loc: "§2.2.2, p.92", quote: "General-purpose AI is primarily trained on language and image datasets that disproportionately represent English-speaking and Western cultures. This contributes to biased output."}
    - {author: IASR 2025 writing team, channel: primary, evidence: argument, qualifier: "the divide section", doc: bengio-2025-international, loc: "§2.3.2, p.120", quote: "These models are likely to not fully capture nuances (grammatical structure, non-Latin scripts, tonal differences, etc.) of non-Western languages, which are underrepresented in the training data, leading to lower accuracy"}

- id: sx-compute-energy
  from: ai-compute-scale
  to: ai-energy-demand
  type: influences
  sign: "+"
  claims:
    - {author: IASR 2025 writing team, channel: primary, evidence: measurement, qualifier: "estimates; 'precise estimates' lacking", doc: bengio-2025-international, loc: "§2.3.4, p.128", quote: "Recent advances in general-purpose AI capabilities have been largely driven by a marked increase in the amount of computation that goes into developing and using AI models, which uses more energy."}
    - {bears_on: "to", author: IASR 2026 writing team, channel: primary, evidence: measurement, qualifier: "IEA projection", doc: bengio-2026-international, loc: "§1.3 (Technical supplement)", quote: "Global AI computation is projected to require electricity consumption similar to that of Austria or Finland by 2026."}

- id: sx-adoption-energy
  from: ai-adoption
  to: ai-energy-demand
  type: influences
  sign: "+"
  claims:
    - {author: IASR 2025 writing team, channel: primary, evidence: argument, qualifier: "key information", doc: bengio-2025-international, loc: "§2.3.4, p.128", quote: "All of these demands increase proportionally to AI development, use, and capability."}

- id: sx-energy-env
  from: ai-energy-demand
  to: environmental-harm
  type: influences
  sign: "+"
  claims:
    - {author: IASR 2025 writing team, channel: primary, evidence: measurement, qualifier: "estimate; 'moderate but rapidly growing'", doc: bengio-2025-international, loc: "§2.3.4, p.128", quote: "data centres and data transmission account for an estimated 1% of global energy-related GHG emissions, with AI consuming 10–28% of data centre energy capacity."}
    - {author: IASR 2025 writing team, channel: primary, evidence: measurement, qualifier: "developer disclosures", doc: bengio-2025-international, loc: "§2.3.4, p.128", quote: "Increases in technology efficiency and uptake of renewable energy have not kept pace with increases in demand for energy"}

- id: sx-energy-pace
  from: ai-energy-demand
  to: capability-pace
  type: influences
  sign: "-?"
  note: A physical balancing loop (compute → energy → bottleneck → slower capability), if energy supply binds.
  claims:
    - {author: IASR 2026 writing team, channel: primary, evidence: argument, qualifier: "uncertain; experts disagree", doc: bengio-2026-international, loc: "§1.3 (Key information)", quote: "Uncertain factors such as technical limits or energy bottlenecks could constrain capability gains despite large investments"}

- id: sx-compute-pace
  from: ai-compute-scale
  to: capability-pace
  type: influences
  sign: "+"
  claims:
    - {author: IASR 2026 writing team, channel: primary, evidence: measurement, qualifier: "trend; 'if these trends continue'", doc: bengio-2026-international, loc: "§1.3", quote: "The key inputs of AI progress – compute, algorithmic improvements, and data – have grown exponentially in recent years"}

# ======================================================= AI welfare (A18)
- id: sx-patienthood-welfare
  from: ai-moral-patienthood
  to: ai-welfare-harm
  type: influences
  sign: "+"
  note: 'Definitional in the sources: harm to welfare presupposes a welfare subject. IASR 2026 declines to assume either way.'
  claims:
    - {author: MIT (Slattery et al.), channel: primary, evidence: argument, qualifier: "subdomain description 7.5; in 'only 3%' of frameworks", doc: slattery-2026-risk, loc: "§7.5, PDF p.50", quote: "Where AIs become sentient, they may deserve moral consideration … Systems may be mistreated or harmed if these rights are not implemented responsibly or we accidentally or intentionally treat AIs as non-sentient where they are sentient."}
    - {author: "Uuk et al.", channel: "relay: remaining-literature.md", evidence: definition, qualifier: "systemic-risk category (FLI-affiliated)", doc: uuk-2024-taxonomy, loc: "Table 1, p.3", quote: "Large-scale harms to animals and the development of AI capable of suffering."}
    - {author: Google DeepMind (Shah et al.), channel: primary, evidence: none-stated, qualifier: "example of a structural risk, out of scope", doc: shah-2025-approach, loc: "§4.4, p.55", quote: "AI systems having consciousness has also been argued as a possibility (Butlin et al., 2023), which would raise concerns for how we should ethically treat AI systems."}

- id: sx-pace-patienthood-uncertain
  from: capability-pace
  to: ai-moral-patienthood
  type: influences
  sign: "?"
  note: MIT says assessment gets harder as systems advance; no source asserts a sign on patienthood itself.
  claims:
    - {author: MIT (Slattery et al.), channel: primary, evidence: argument, qualifier: "about assessability, not about the quantity", doc: slattery-2026-risk, loc: "§7.5, PDF p.50", quote: "As AI technology advances, it will become more challenging to assess whether an AI has developed the sentience, consciousness, or self-awareness that would grant it moral status."}

# ======================================================= into the mp shard's deployment exposure
- id: sx-fma-criticality
  from: perceived-first-mover-advantage
  to: deployment-criticality
  type: influences
  sign: "+"
  claims:
    - {author: IASR 2026 writing team, channel: primary, evidence: argument, qualifier: "citing IASR 2025", doc: bengio-2026-international, loc: "§2.2.2 (How will deployment environments affect loss of control risk?)", quote: "Deployment decisions are shaped by economic incentives, strategic pressures, and the expectation that early adoption confers a lasting advantage. These dynamics will also shape how and when actors deploy AI systems in sensitive environments such as critical infrastructure or AI research and development itself."}

- id: sx-military-criticality
  from: military-ai-adoption
  to: deployment-criticality
  type: part_of
  note: Military command and weapons are among the most critical deployment environments.
  claims:
    - {author: "UK DSIT", channel: "relay: uk.md", evidence: argument, qualifier: "a condition for catastrophe; discussion paper", doc: dsit-2023-capabilities, loc: "p.28", quote: "For loss of control to be a catastrophic risk, AI systems would need to be given or gain some control over systems with significant impacts, such as military or financial systems."}

- id: sx-reliance-enfeeble
  from: reliance-on-ai
  to: reliance-on-ai
  type: influences
  sign: "+"
  note: 'CAIS states the reinforcing direction the core carries only as an integrator inference (r-erosion-reliance): complexity makes more reliance the only feasible answer.'
  claims:
    - {author: "CAIS (Hendrycks et al.)", channel: primary, evidence: argument, qualifier: "gradual slide into dependence", doc: hendrycks-2023-overview, loc: "§3.2.2, printed p.19", quote: "As society's challenges become ever more complex and fast-paced, and as AIs become ever more intelligent and quick-thinking, we may forfeit more and more functions to them out of convenience. In such a state, the only feasible solution to the complexities and challenges compounded by AIs may be to rely even more heavily on AIs."}
