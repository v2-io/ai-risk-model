    - {author: IASR 2026 writing team, channel: primary, evidence: measurement, qualifier: "'latest research suggests'", doc: bengio-2026-international, loc: "§2.1.2 (Key information)", quote: "people who interact with AI systems for longer and in more personal ways are more likely to find their content persuasive."}

