    - {bears_on: "from", author: "CAISI (US)", channel: "relay: us-gov-recent.md", evidence: measurement, qualifier: "State Department-built benchmark; PRC models vs US reference", doc: nist-2025-caisi-deepseek, loc: "p.21", quote: "CCP-Narrative-Bench"}
    - {author: IASR 2025 writing team, channel: primary, evidence: argument, qualifier: "a named source of bias", doc: bengio-2025-international, loc: "§2.2.2, p.92", quote: "Certain design choices, such as content filtering techniques used to align systems with particular worldviews, can also contribute to biased output."}

- id: sx-culture-rate
  from: ai-adoption
  to: cultural-evolution-rate
