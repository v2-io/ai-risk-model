- {concept: resilience-measures, rel: close, src: dsit-2025-cyber-governance, term: "Cyber resilience", quote: "The overall ability of systems, organisations and citizens to withstand cyber events and, where harm is caused, recover from them.", channel: "relay: uk-security-frameworks.md"}
- {concept: adaptation-buffer, rel: exact, src: aisi-2025-frontier, term: "adaptation buffer", loc: "§4, p.28", channel: primary, note: "AISI credits Helen Toner, 'Non-proliferation is the wrong approach to AI misuse' (2025)."}
