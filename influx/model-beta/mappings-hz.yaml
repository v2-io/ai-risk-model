# Hazards and misuse slice (shard): lexicon. rel is from the SOURCE term to OUR concept (see mappings.yaml).
# Main pooling finds, marked in `note`:
#   "uplift" is measured against five different baselines, and the baseline is moving (see novice-uplift entries);
#   "CBRN" is chem/bio in substance nearly everywhere;
#   "safeguards" pools AISI's misuse safeguards and control safeguards (so does the core's safeguard-strength);
#   "Information Security" (NIST) and "AI security" name both attacks WITH AI and attacks ON AI;
#   "open-source" (AISI Trends) is defined strictly but measured on open-weight leaderboards.

# ---- uplift: one word, many baselines
- {concept: novice-uplift, rel: close, src: eu-cop-2025-safety-security, term: "significantly lowering the barriers to entry for malicious actors", loc: "App. 1.4(1), 1.4(3)", channel: primary, note: "The EU Code defines CBRN and cyber risk with two prongs: this one (breadth) and 'significantly increasing the potential impact achieved' (depth)."}
- {concept: expert-uplift, rel: close, src: eu-cop-2025-safety-security, term: "significantly increasing the potential impact achieved", loc: "App. 1.4(1), 1.4(3)", channel: primary}
- {concept: novice-uplift, rel: close, src: bengio-2026-international, term: "uplift studies", loc: "§2.1.4 Box 2.3", quote: "relative to a relevant baseline such as merely having internet access", channel: primary, note: "Baseline 1: internet access. Same as AISI's protocol study ('a group using the internet alone')."}
- {concept: novice-uplift, rel: close, src: gdm-2026-fsf-v3-1, term: "uplift (baseline)", loc: "fn 8, p.11", quote: "relative to a baseline without generative AI", channel: "relay: company-frameworks-gdm.md", note: "Baseline 2: a world without generative AI."}
- {concept: novice-uplift, rel: close, src: meta-2026-advanced-ai-scaling-framework, term: "Net new", loc: "p.14", quote: "The outcome cannot currently be realized as described (e.g. at that scale / by that threat actor / for that cost) with existing tools and resources but without access to general-purpose AI.", channel: "relay: company-frameworks-meta-msft-amzn.md", note: "Baseline 2 again. OpenAI's PF 'Net new' is the same with a fixed date ('available as of 2021')."}
- {concept: novice-uplift, rel: close, src: microsoft-2026-frontier-governance-framework, term: "marginal capability uplift", loc: "p.6", quote: "over and above currently available tools and information, including currently available open-weights models", channel: "relay: company-frameworks-meta-msft-amzn.md", note: "Baseline 3: today's open-weight models. A moving baseline: as open models improve, the same capability counts as less uplift (hz-openweight-safeguard)."}
- {concept: novice-uplift, rel: close, src: amazon-2026-frontier-model-safety-framework, term: "uplift (CBRN)", loc: "p.2, l.58-60", quote: "beyond other publicly available models in known harnesses", channel: "relay: company-frameworks-meta-msft-amzn.md", note: "Baseline 4: public models in harnesses. Amazon 2025 said 'beyond other publicly available research or tools, such as internet search' (Baseline 1). The baseline moved within one developer's framework."}
- {concept: novice-uplift, rel: related, src: aisi-2025-crimes-future, term: "uplift criminal activity", quote: "Our evaluations are formal measurements of a model's ability to uplift criminal activity.", channel: primary, note: "AISI treats uplift as a property of the model; Amazon frames it as uplift to an actor (company-frameworks-meta-msft-amzn.md). Two framings of one word."}
- {concept: novice-uplift, rel: narrow, src: anthropic-2026-risk-report-aug, term: "CB-1 threat model", loc: "§4.2.1, p.116", quote: "Individuals or groups with relatively modest resources", channel: primary}
- {concept: expert-uplift, rel: narrow, src: anthropic-2026-risk-report-aug, term: "CB-2 threat model", loc: "§4.2.2, pp.118-119", quote: "today we believe that the risk primarily stems from moderately to very well-resourced programs, including but not limited to state programs", channel: primary}
- {concept: novice-uplift, rel: broad, src: nist-2025-managing, term: "Misuse Risk", loc: "Glossary p.22", quote: "A risk that an AI model will be deliberately misused to cause harm.", channel: "relay: us-security.md", note: "Pools breadth and depth; the same for GDM's 'misuse' (FSF fn 2)."}
- {concept: expert-uplift, rel: broad, src: nist-2025-managing, term: "Misuse Risk", loc: "Glossary p.22", channel: "relay: us-security.md"}

# ---- CBRN: named as four, assessed as two
- {concept: cbrn-weapons-harm, rel: exact, src: eu-cop-2025-safety-security, term: "Chemical, biological, radiological and nuclear", loc: "App. 1.4(1)", quote: "Risks from enabling chemical, biological, radiological, and nuclear (CBRN) attacks or accidents.", channel: primary, note: "Includes accidents. Most frameworks' tiers are chem/bio only (company-frameworks.md)."}
- {concept: cbrn-weapons-harm, rel: narrow, src: bengio-2026-international, term: "Biological and chemical risks", loc: "§2.1.4", channel: primary, note: "IASR 2026 does not assess radiological or nuclear."}
- {concept: cbrn-weapons-harm, rel: related, src: aisi-2025-research, term: "Dual-use Science", loc: "PDF p.5", channel: "relay: uk.md", note: "AISI withholds the domain's detail: 'We will not cover details of our work in this Dual-use Science in this document'."}
- {concept: cb-weapons-capability, rel: close, src: nationalinstituteofstandardsandtechnologyus-2024-artificial, term: "CBRN Information or Capabilities", loc: "risk #1, p.4", quote: "Eased access to or synthesis of materially nefarious information or design capabilities related to chemical, biological, radiological, or nuclear (CBRN) weapons or other dangerous materials or agents.", channel: primary}
- {concept: bio-design-tool-capability, rel: exact, src: nationalinstituteofstandardsandtechnologyus-2024-artificial, term: "biological design tools (BDTs)", loc: "§2.1, p.5", channel: primary}

# ---- cyber: attacks with AI, attacks on AI
- {concept: ai-enabled-cyberattacks, rel: close, src: eu-cop-2025-safety-security, term: "Cyber offence", loc: "App. 1.4(3)", quote: "Risks from enabling large-scale sophisticated cyber-attacks, including on critical systems (e.g. critical infrastructure).", channel: primary}
- {concept: ai-enabled-cyberattacks, rel: close, src: aisi-2025-research, term: "Cyber Misuse", channel: "relay: uk.md"}
- {concept: ai-enabled-cyberattacks, rel: broad, src: nationalinstituteofstandardsandtechnologyus-2024-artificial, term: "Information Security", loc: "§2.9, p.10", quote: "GAI-based systems present two primary information security risks: GAI could potentially discover or enable new cybersecurity risks by lowering the barriers for or easing automated exercise of offensive capabilities; simultaneously, it expands the available attack surface", channel: primary, note: "Pooled: one NIST category holds attacks using AI and attacks on AI."}
- {concept: attacks-on-ai-systems, rel: broad, src: nationalinstituteofstandardsandtechnologyus-2024-artificial, term: "Information Security", loc: "§2.9, p.10", channel: primary}
- {concept: offensive-cyber-capability, rel: narrow, src: openai-2026-path-to-astra, term: "Critical cybersecurity capability", quote: "We now believe Astra meets the Critical cybersecurity capability threshold under our Preparedness Framework", channel: "relay: company-frameworks-openai.md", note: "A threshold on the capability, crossed for the first time in Sep 2026."}
- {concept: offensive-cyber-capability, rel: related, src: eo-2026-14409, term: "covered frontier model", loc: "§3(a)", quote: "a classified benchmarking process to assess the advanced cyber capabilities of AI models", channel: "relay: us-gov-recent.md", note: "US federal threshold defined by cyber capability alone; set by NSA; not public."}
- {concept: ai-system-security, rel: exact, src: dsit-2025-ai-cyber-cop, term: "AI security", loc: "Scope", quote: "'AI security' which is considered a subset of cyber security", channel: "relay: uk-security-frameworks.md", note: "AISP p.34 notes 'AI security' also means the national-security implications of AI (us-security.md): a pooled term."}
- {concept: attacks-on-ai-systems, rel: narrow, src: nist-2025-caisi-deepseek, term: "agent hijacking", quote: "follow malicious instructions designed to derail them from user tasks", channel: primary, note: "CAISI: 'agent hijacking, also known as indirect prompt injection' (us-gov-recent.md)."}
- {concept: attacks-on-ai-systems, rel: narrow, src: ncsc-2025-prompt-injection, term: "prompt injection", quote: "Prompt injection is where developers concatenate their own instructions with untrusted content in a single prompt, and then treat the model's response as if there were a robust boundary", channel: "relay: uk-security-frameworks.md", note: "Mechanism-based. The DSIT Implementation Guide defines it by outcome ('prompts that produce unintended or harmful outputs'), which also covers jailbreaks."}
- {concept: attacks-on-ai-systems, rel: narrow, src: bengio-2026-international, term: "tampering", loc: "§2.1.3 Box 2.1", quote: "interfering with the development of an AI system to alter its behaviour when deployed", channel: primary}
- {concept: attacks-on-ai-systems, rel: narrow, src: aisi-2025-poisoning-blog, term: "data poisoning", quote: "Data poisoning occurs when individuals distribute online content designed to corrupt an AI model's training data, potentially producing dangerous behaviours.", channel: "relay: uk-security-frameworks.md"}

# ---- safeguards and jailbreaks
- {concept: safeguard-strength, rel: narrow, src: aisi-2026-control-red-team, term: "misuse safeguards", quote: "protections against humans deliberately eliciting harmful actions from a model", channel: "relay: uk-security-frameworks.md", note: "AISI separates these from 'control safeguards, which address harmful actions that agents take of their own accord'. The core safeguard-strength pools both (its definition lists 'control monitors')."}
- {concept: safeguard-strength, rel: narrow, src: aisi-2026-control-red-team, term: "control safeguards", quote: "control safeguards, which address harmful actions that agents take of their own accord", channel: "relay: uk-security-frameworks.md"}
- {concept: safeguard-strength, rel: related, src: aisi-2025-frontier, term: "universal jailbreak", loc: "§4, p.24", quote: "Attacks that work across a range of malicious requests for a given model are universal jailbreaks.", channel: primary}
- {concept: safeguard-strength, rel: close, src: eu-cop-2025-safety-security, term: "vulnerability to adversarial removal of guardrails", loc: "App. 1.3.3(5)", channel: primary, note: "Inverse: a risk source that is the absence of this concept."}

# ---- open weights
- {concept: open-weight-capability, rel: close, src: bengio-2026-international, term: "open-weight models", loc: "§3.4", quote: "Models whose weights are publicly available are called 'open-weight models'.", channel: primary}
- {concept: open-weight-capability, rel: related, src: aisi-2025-frontier, term: "open-source models", loc: "§7, p.42", quote: "A model is open-source when its parameters, code, and training process are made freely available (they are distinct from open-weight models, whose parameters only are made freely available).", channel: primary, note: "Defined strictly, but the gap figures that follow come from leaderboards of mostly open-weight models (uk.md)."}
- {concept: open-weight-capability, rel: related, src: eu-cop-2025-safety-security, term: "release and distribution strategies", loc: "App. 1.3.3(3)", channel: primary}
- {concept: capability-diffusion, rel: related, src: anderljung-2023-frontier, term: "The Proliferation Problem", loc: "p.10", quote: "Frontier AI models can proliferate rapidly, making accountability difficult", channel: "relay: academic-ngo.md"}
- {concept: open-weight-capability, rel: related, src: bengio-2026-international, term: "marginal risk", loc: "§3.4 Key information", quote: "the extent to which their release counterfactually increases societal risk beyond that already posed by existing models or other technologies. ... Small increases in marginal risk over time can also add up to substantial increases in overall risk.", channel: primary, note: "IASR names the ratchet in hz-openweight-safeguard: each release judged against the last."}

# ---- offence, defence, resilience
- {concept: offence-defence-balance, rel: exact, src: bengio-2026-international, term: "offence-defence balance", loc: "§3.5", quote: "the relative advantage between attackers and defenders", channel: primary}
