- {concept: defender-resilience-lag, rel: exact, src: ncsc-2025-impact, term: "digital divide", loc: "PDF p.2", quote: "a digital divide between systems keeping pace with AI-enabled threats and a large proportion that are more vulnerable", channel: primary, note: "Not the global access divide (report row A16), which IASR 2025 calls the 'Global AI R&D divide' (uk.md)."}
