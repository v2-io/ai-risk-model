# Societal and structural slice (shard `sx`): lexicon. rel is from the SOURCE term to OUR concept (see mappings.yaml).
# The main pooled terms: "manipulation" (six constructs), "concentration of power" (four), "divide" (two),
# "systemic risk" (three definitions, two inside IASR 2026), "non-human welfare" (animal vs AI), "bias" (harm vs regulatory overreach).

# ---- manipulation (§5.3): one word, six constructs
- {concept: population-manipulation, rel: exact, src: eu-cop-2025-safety-security, term: "harmful manipulation", loc: "App. 1.4(4)", quote: "Risks from enabling the strategic distortion of human behaviour or beliefs by targeting large populations or high-stakes decision-makers through persuasion, deception, or personalised targeting.", channel: "relay: eu.md", note: "Specified systemic risk. No misuser required."}
- {concept: persuasion-capability, rel: related, src: eu-cop-2025-safety-security, term: "harmful manipulation", loc: "App. 1.4(4)", quote: "This includes significantly enhancing capabilities for persuasion, deception, and personalised targeting", channel: "relay: eu.md", note: "The EU risk includes the capability uplift itself."}
- {concept: individual-manipulation, rel: narrow, src: eu-2024-ai-act, term: "purposefully manipulative or deceptive techniques (prohibited practice)", loc: "Art. 5(1)(a)", quote: "materially distorting the behaviour of a person or a group of persons by appreciably impairing their ability to make an informed decision … in a manner that causes or is reasonably likely to cause that person, another person or group of persons significant harm", channel: "relay: eu.md", note: "A system-level prohibition with a significant-harm threshold; a different construct from the Code's population-scale risk."}
- {concept: individual-manipulation, rel: close, src: bengio-2026-international, term: "manipulation", loc: "glossary; §2.1.2", quote: "influencing someone in order to achieve a goal without their full awareness or understanding", channel: primary, note: "Includes 'unintended manipulative effects' (sycophancy, companion dependence). IASR: 'this distinction is contentious'."}
- {concept: population-manipulation, rel: related, src: bengio-2026-international, term: "Influence and manipulation (§2.1.2)", loc: "§2.1.2", quote: "There is little evidence that AI-generated content is manipulating people at scale.", channel: "relay: uk.md", note: "The section heading covers both scales; this sentence is about the population scale."}
- {concept: individual-manipulation, rel: broad, src: aisi-2025-research, term: "Human Influence", loc: "domain list", quote: "Risks posed by AI being used to manipulate, persuade, deceive, or imperceptibly influence humans.", channel: primary, note: "AISI's domain spans overt persuasion, para-social relationships and 'imperceptible influence … for commercial or political ends'."}
- {concept: population-manipulation, rel: broad, src: aisi-2025-research, term: "Human Influence", loc: "Abstract", quote: "if applied at scale, manipulate large groups of people, creating large-scale social instability", channel: primary}
- {concept: information-ecosystem-degradation, rel: close, src: nationalinstituteofstandardsandtechnologyus-2024-artificial, term: "Information Integrity", loc: "risk #8, p.4", quote: "Lowered barrier to entry to generate and support the exchange and consumption of content which may not distinguish fact from opinion or fiction or acknowledge uncertainties, or could be leveraged for large-scale dis- and mis-information campaigns.", channel: primary, note: "NIST has no 'manipulation' category. The US Action Plan orders 'misinformation' removed from the AI RMF (us-gov-recent.md)."}
