# ---- systemic risk (§5.1): three definitions
- {concept: g-societal, rel: broad, src: eu-2024-ai-act, term: "systemic risk", loc: "Art. 3(65)", quote: "a risk that is specific to the high-impact capabilities of general-purpose AI models, having a significant impact on the Union market due to their reach, or due to actual or reasonably foreseeable negative effects on public health, safety, public security, fundamental rights, or the society as a whole, that can be propagated at scale across the value chain", channel: "relay: eu.md", note: "Spans every hazard in the model when frontier-specific and at scale; organizational matters appear only as mitigations."}
- {concept: g-societal, rel: close, src: bengio-2026-international, term: "systemic risks (body)", loc: "p.15 fn", quote: "risks that result from widespread deployment of highly capable general-purpose AI across society and the economy", channel: "relay: uk.md", note: "IASR 2026's chapter 2.3 holds only labour and autonomy."}
- {concept: g-societal, rel: related, src: bengio-2026-international, term: "Systemic risks (glossary)", loc: "glossary p.154", quote: "Risks that arise from how AI development and deployment changes human behaviour, organisational practices, or societal structures, rather than directly from AI capabilities.", channel: "relay: uk.md", note: "Differs from IASR's own body text. Under this sense, changed organizational practices are a SOURCE of systemic risk."}
- {concept: g-societal, rel: close, src: uuk-2024-taxonomy, term: "systemic risk", loc: "p.4", quote: "large-scale societal risks", channel: "relay: remaining-literature.md", note: "Adopts the AI Act wording; 13 categories, 50 sources."}
- {concept: g-societal, rel: related, src: aisi-2025-research, term: "Societal Resilience", loc: "domain list", quote: "Risks that will emerge as frontier AI systems are deployed widely and interact with economic and societal structures.", channel: primary, note: "AISI does not use 'systemic risk'."}
- {concept: bias-discrimination, rel: related, src: hacker-2026-digital, term: "discrimination at scale", loc: "§8.1, p.13", quote: "we conclude that large-scale discrimination does count as systemic risk", channel: "relay: eu.md"}

