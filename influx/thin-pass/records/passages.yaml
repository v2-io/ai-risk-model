# Passages: the source words the thin pass rests on.
#
# Rough format, invented for G1b (plan §3.5's proposal, as far as it went):
#   doc     relata key; the text read is `pdftotext -layout` of its PDF
#   page    PDF page (form feeds + 1), which survives re-extraction
#   lines   line range in that extraction (bin/extract-text KEY)
#   quote   exact words, compared after whitespace, quote-mark and
#           zero-width-space normalization (tools/check.py)
# tools/check.py recomputes the page, confirms the quote is inside the line
# range, and reports the quote's match count in the whole document.
#
# Where the format broke is in ../weight-and-defects.md (the entries on anchors).
# Disposable: nothing here is adopted into def/ or the plan except by a later
# decision.

