    quote: >-
      (2) If a frontier developer discovers that a critical safety incident poses an imminent risk of
      death or serious physical injury, the frontier developer shall disclose that incident within 24
      hours to an authority
  - id: P-sb53-bp-severity
    doc: california-2025-sb53
