# Scopes, in address theory's sense (addr:scope, imported by reference at
# v2-io/udon 90f4fb6): where a source's bindings are kept and collisions
# counted. Only the scopes this pass needed.
scopes:
  - id: S-sb53-bp
    what: Business and Professions Code, Division 8, Chapter 25.1 (TFAIA), §§22757.10-22757.16, added by SB 53 §2
    enclosed_by: California Business and Professions Code (not read)
  - id: S-sb53-lab
    what: Labor Code, Part 3 of Division 2, Chapter 5.1 (whistleblower protections), §§1107-1107.2, added by SB 53 §4
    enclosed_by: California Labor Code (not read)
    edges:
      - to: S-sb53-bp
        label: imports-definition
        passage: P-sb53-lab-fd-import
        note: §1107(d)-(f) give "foundation model", "frontier developer" and "large frontier developer" "the meaning defined in Section 22757.11". "Catastrophic risk" and "critical safety incident" are NOT imported; the Labor Code mints its own.
  - id: S-sb53-uncodified
    what: SB 53 §§1, 5, 6 (findings, construction, severability, preemption), which apply to the whole act
  - id: S-raise-gbl-44b
    what: New York General Business Law Article 44-B as replaced by S.8828 §2, §§1420-1429

passages:
  # ---- SB 53: provenance
  - id: P-sb53-published
    doc: california-2025-sb53
    page: 1
    lines: "11"
    quote: "Date Published: 09/29/2025"

  # ---- SB 53, B&P Chapter 25.1: catastrophic risk
  - id: P-sb53-bp-cr
    doc: california-2025-sb53
    page: 4
    lines: 187-190
    quote: >-
      (c) (1) "Catastrophic risk" means a foreseeable and material risk that a frontier developer's
      development, storage, use, or deployment of a frontier model will materially contribute to the
      death of, or serious injury to, more than 50 people or more than one billion dollars
      ($1,000,000,000) in damage to, or loss of, property arising from a single incident involving a
      frontier model doing any of the following:
  - id: P-sb53-bp-cr-conducts
    doc: california-2025-sb53
    page: 4
    lines: 192-199
    quote: >-
      (A) Providing expert-level assistance in the creation or release of a chemical, biological,
      radiological, or nuclear weapon. (B) Engaging in conduct with no meaningful human oversight,
      intervention, or supervision that is either a cyberattack or, if the conduct had been committed
      by a human, would constitute the crime of murder, assault, extortion, or theft, including theft
      by false pretense. (C) Evading the control of its frontier developer or user.
  - id: P-sb53-bp-cr-excl
    doc: california-2025-sb53
    page: 4
    lines: 201-209
    quote: >-
      (2) "Catastrophic risk" does not include a foreseeable and material risk from any of the
      following: (A) Information that a frontier model outputs if the information is otherwise publicly
      accessible in a substantially similar form from a source other than a foundation model. (B) Lawful
      activity of the federal government. (C) Harm caused by a frontier model in combination with other
      software if the frontier model did not materially contribute to the harm.

  # ---- SB 53, B&P: critical safety incident
  - id: P-sb53-bp-csi
    doc: california-2025-sb53
    page: 4
    lines: 211-218
    quote: >-
      (d) "Critical safety incident" means any of the following: (1) Unauthorized access to,
      modification of, or exfiltration of, the model weights of a frontier model that results in death
      or bodily injury. (2) Harm resulting from the materialization of a catastrophic risk. (3) Loss of
      control of a frontier model causing death or bodily injury.
  - id: P-sb53-bp-csi4
    doc: california-2025-sb53
    page: 4
    lines: 220-222
    quote: >-
      (4) A frontier model that uses deceptive techniques against the frontier developer to subvert the
      controls or monitoring of its frontier developer outside of the context of an evaluation designed
      to elicit this behavior and in a manner that demonstrates materially increased catastrophic risk.

  # ---- SB 53, B&P: the defined terms the conditions lean on
  - id: P-sb53-bp-fd
    doc: california-2025-sb53
    page: 4
    lines: 241-243
    quote: >-
      (h) "Frontier developer" means a person who has trained, or initiated the training of, a frontier
      model, with respect to which the person has used, or intends to use, at least as much computing
      power to train the frontier model as would meet the technical specifications found in
      subdivision (i).
  - id: P-sb53-bp-fm
    doc: california-2025-sb53
    page: 4
    lines: 245-250
    quote: >-
      (i) (1) "Frontier model" means a foundation model that was trained using a quantity of computing
      power greater than 10^26 integer or floating-point operations. (2) The quantity of computing power
      described in paragraph (1) shall include computing for the original training run and for any
      subsequent fine-tuning, reinforcement learning, or other material modifications the developer
      applies to a preceding foundation model.
  - id: P-sb53-bp-property
    doc: california-2025-sb53
    page: 5
    lines: "257"
    quote: '(l) "Property" means tangible or intangible property.'
  - id: P-sb53-bp-equity
    doc: california-2025-sb53
    page: 8
    lines: 511-512
    quote: >-
      22757.16. The loss of value of equity does not count as damage to or loss of property for the
      purposes of this chapter.

