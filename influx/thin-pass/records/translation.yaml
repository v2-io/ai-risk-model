    source_term: Catastrophic Risk
    scope: xai-2025-faif (whole document)
    binding: incorporated
    minted_at: P-xai25-scope
    intended_cardinality: "{0,N}"
    ours: thin:risk.possibility
    frame: F-xai25-cr
    skos: "exactMatch to T-sb53-bp-cr, by incorporation. The target is another source's row, not one of our terms; no row maps to a single term of ours."
    justification: "'Catastrophic Risk as defined in the TFAIA'. Footnote 1 quotes §22757.11(c)(1) with (A)-(C) verbatim (P-xai25-fn, P-xai25-fn-conducts) and stops before the exclusions in (c)(2); incorporation brings those in anyway. R-xai25-incorporation."
