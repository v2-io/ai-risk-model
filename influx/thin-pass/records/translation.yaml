        slot: propagation condition
        words: that can be propagated at scale across the value chain
        test: {fact: propagable_at_scale_across_value_chain}

  # ================================================================ OpenAI FGF and PF
  - id: F-fgf-systemic
    row: T-fgf-systemic
    applies_to: risk
    concept: thin:source-umbrella
    closure: "closed or open: R-fgf-umbrella-closure"
    in_force: {from: "2026-05-28", note: "the catalog's date; no date line was read in the document"}
    passages: [P-fgf-umbrella, P-fgf-tfaia-coverage]
    slots:
      - key: members
        slot: umbrella members
        words: 'when we refer to "systemic" risks, we mean both catastrophic risks under the TFAIA and systemic risks under the EU AI Act'
        test:
          ambiguous: R-fgf-umbrella-closure
          candidates:
            closed-the-sentence-summarizes:
              any:
                - {frame: F-sb53-bp-cr}
                - {frame: F-eu-systemic}
            open-the-sentence-adds:
              any:
                - {frame: F-sb53-bp-cr}
                - {frame: F-eu-systemic}
                - {frame: F-fgf-own}

  - id: F-fgf-own
    row: T-fgf-systemic
    applies_to: risk
    concept: thin:risk.possibility
    closure: open              # "includes ... including"
    in_force: {from: "2026-05-28"}
    passages: [P-fgf-def, P-fgf-tfaia-coverage, P-fgf-categories-intro, P-fgf-loc-cell, P-fgf-manipulation-cell]
    slots:
      - key: model-conduct
        slot: thin:model-conduct-condition
        words: "this FGF definition currently addresses the following systemic risk categories: Cyber offense ... CBRN ... Harmful manipulation ... Loss of control: Risks stemming from the inability to reliably direct, modify, or shut down a model, including evading the controls of a model developer or user, or autonomous conduct that, if conducted by a human, would constitute a crime of murder, assault, extortion, or theft."
        note: SB 53's (B) and (C), nearly verbatim, moved into a category table that the FGF ties to "this FGF definition". Repaired after de-novo-feedback-1 §3.3.
        resolution: R-fgf-categories
        test:
          ambiguous: R-fgf-categories
          candidates:
            restrictive: {fact: risk_in_listed_category}
            illustrative: {all: []}
      - key: knowledge
        slot: thin:knowledge-standard
        words: foreseeable
        test: {fact: risk_foreseeable_at_conduct}
      - key: materiality
        slot: thin:materiality
        words: material
        test: {fact: risk_material}
      - key: bearer
        slot: thin:conduct-bearer
        words: "the development, storage, use, or deployment of our most advanced frontier models"
        note: "'frontier' as defined under the TFAIA (P-fgf-tfaia-coverage); 'our' makes OpenAI the bearer without SB 53's role test"
        test: {all: [{fact: model_is_frontier}, {fact: model_most_advanced_at_time}, {fact: model_is_publishers_own}]}
      - key: contribution
        slot: thin:causal-contribution
        words: a model will materially contribute to
        test: {fact: model_materially_contributed}
      - key: bar
        slot: thin:magnitude-bar
        words: "severe harm ... including risks that a model will materially contribute to greater than 50 fatalities or $1 billion of property damages or losses arising from a single incident"
        also: [thin:bar-closure, thin:counting-unit, thin:harm.kind]
        resolution: R-fgf-severe
        test:
          any:
            - label: "the example (sufficient, not necessary)"
              all:
                - {fact: single_incident}
                - any: [{cmp: [deaths, ">", 50]}, {cmp: [property_loss_usd, ">", 1000000000]}]
            - {fact: severe_harm_genus, genus: true, label: "the genus, 'severe harm', unbound (R-fgf-severe)"}

  - id: F-fgf-severe
    row: T-fgf-severe
    applies_to: harm
    concept: thin:harm.kind
    closure: unbound
    in_force: {from: "2026-05-28"}
    passages: [P-fgf-def, P-fgf-pf-sense, P-pf-severe]
    slots:
      - key: sense
        slot: thin:magnitude-bar
        words: risks of severe harm ... including risks that a model will materially contribute to greater than 50 fatalities
        test:
          ambiguous: R-fgf-severe
          candidates:
            fgf-local:
              any:
                - all: [{fact: single_incident}, {cmp: [deaths, ">", 50]}]
                - {fact: severe_harm_genus}
            pf-sense-imported: {frame: F-pf-severe}

  - id: F-pf-severe
    row: T-pf-severe
    applies_to: harm
    concept: thin:harm.kind
    closure: closed
    in_force: {from: "2025", note: "PF v2; version date not read"}
    passages: [P-pf-severe]
    slots:
      - key: bar
        slot: thin:magnitude-bar
        words: "the death or grave injury of thousands of people or hundreds of billions of dollars of economic damage"
        test:
          ambiguous: R-pf-thousands
          candidates:
            at-least-1000: {any: [{cmp: [{sum: [deaths, grave_injuries]}, ">=", 1000]}, {cmp: [economic_damage_usd, ">=", 100000000000]}]}
            at-least-2000: {any: [{cmp: [{sum: [deaths, grave_injuries]}, ">=", 2000]}, {cmp: [economic_damage_usd, ">=", 200000000000]}]}
