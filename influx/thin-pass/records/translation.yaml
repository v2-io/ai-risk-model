    justification: Word for word SB 53's B&P definition, except "fifty" for "50" and no "($1,000,000,000)". Its "person" is defined, as SB 53's is not (R-raise-person).
  - id: T-raise-csi
    source_term: Critical safety incident
    scope: S-raise-gbl-44b
    binding: bound
    minted_at: P-raise-csi
    intended_cardinality: "{0,N}"
    ours: thin:event-status.conferred
    frame: F-raise-csi
    skos: none fits
    justification: SB 53's B&P limbs, word for word in the passage read.

  # ------------------------------------------------------------ companies
