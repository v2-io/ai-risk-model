    intended_cardinality: "{0,N}"
    ours: thin:source-umbrella
    frame: F-fcf-systemic
    skos: none fits
    justification: "Declared twice with 'include'. Whether 'include both X and Y' is open (the FCF's own sentence adds members) or exhaustive (it summarizes the two statutes) is R-fcf-umbrella, the same test as the FGF's R-fgf-umbrella-closure."
  - id: T-fgf-systemic
