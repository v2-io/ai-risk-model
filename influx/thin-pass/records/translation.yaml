frames:
  # ================================================================ SB 53 B&P
  - id: F-sb53-bp-cr
    row: T-sb53-bp-cr
    applies_to: risk
    concept: thin:risk.possibility
    closure: closed            # thin:bar-closure: "means"
    in_force: {from: null, note: "The extraction carries no operative-date clause; California's default rule was not read in this pass."}
    passages: [P-sb53-bp-cr, P-sb53-bp-cr-conducts, P-sb53-bp-cr-excl, P-sb53-bp-property, P-sb53-bp-equity, P-sb53-bp-bar]
    slots:
      - key: knowledge
        slot: thin:knowledge-standard
        words: foreseeable
        resolution: R-foreseeable
        test: {fact: risk_foreseeable_at_conduct}
      - key: materiality
        slot: thin:materiality
        words: material
        resolution: R-material
        test: {fact: risk_material}
      - key: bearer
        slot: thin:conduct-bearer
        words: "a frontier developer's development, storage, use, or deployment of a frontier model"
        test: {all: [{fact: developer_is_frontier_developer}, {fact: model_is_frontier}]}
      - key: contribution
        slot: thin:causal-contribution
        words: will materially contribute to
        resolution: R-materially-contribute
        test: {fact: developer_conduct_materially_contributed}
      - key: bar
        slot: thin:magnitude-bar
        words: "the death of, or serious injury to, more than 50 people or more than one billion dollars ($1,000,000,000) in damage to, or loss of, property arising from a single incident"
        also: [thin:aggregation, thin:counting-unit, thin:harm.kind]
        resolution: [R-pooling, R-single-incident-attachment, R-incident]
        note: >-
          "arising from a single incident involving a frontier model doing any of the following" is one
          phrase. So the conduct list (slot model-conduct) is evaluated here, under each reading of what
          the phrase attaches to. Repaired after de-novo-feedback-1 §3.4: before, the conduct list was
          required under both readings, which made the property-only reading contradict its own record.
        test:
          ambiguous: R-single-incident-attachment
          candidates:
            attaches-to-both:
              all:
                - {fact: single_incident}
                - {fact_in: [model_conduct, [cbrn-expert-assistance, unsupervised-cyberattack, unsupervised-crime-equivalent, control-evasion]]}
                - any:
                    - ambiguous: R-pooling
                      candidates:
                        pooled: {cmp: [{sum: [deaths, serious_injuries]}, ">", 50]}
                        separate: {any: [{cmp: [deaths, ">", 50]}, {cmp: [serious_injuries, ">", 50]}]}
                    - {cmp: [property_loss_usd_excl_equity, ">", 1000000000]}
            property-only:
              any:
                - ambiguous: R-pooling
                  candidates:
                    pooled: {cmp: [{sum: [deaths, serious_injuries]}, ">", 50]}
                    separate: {any: [{cmp: [deaths, ">", 50]}, {cmp: [serious_injuries, ">", 50]}]}
                - all:
                    - {fact: single_incident}
                    - {fact_in: [model_conduct, [cbrn-expert-assistance, unsupervised-cyberattack, unsupervised-crime-equivalent, control-evasion]]}
                    - {cmp: [property_loss_usd_excl_equity, ">", 1000000000]}
      - key: model-conduct
        slot: thin:model-conduct-condition
        words: "involving a frontier model doing any of the following: (A) Providing expert-level assistance ... (B) Engaging in conduct with no meaningful human oversight ... (C) Evading the control of its frontier developer or user."
        also: [thin:uplift.expert-level, thin:unsupervised-conduct, thin:counterfactual-human-actor-test, thin:control-evasion]
        resolution: R-control
        note: evaluated inside the bar slot (see its note); kept as a slot so drift can compare its words
        test: {all: []}
      - key: exclusions
        slot: exclusions
        words: "does not include ... (A) Information ... otherwise publicly accessible ... (B) Lawful activity of the federal government. (C) Harm caused by a frontier model in combination with other software if the frontier model did not materially contribute"
        also: [thin:exclusion.availability-baseline, thin:exclusion.actor-legality, thin:exclusion.no-material-contribution]
        test: {not: {any: [{fact: excluded_public_info}, {fact: excluded_lawful_federal}, {fact: excluded_software_no_contribution}]}}

  - id: F-sb53-bp-csi
    row: T-sb53-bp-csi
    applies_to: occurrence
    concept: thin:event-status.conferred
    closure: closed
    in_force: {from: null}
    passages: [P-sb53-bp-csi, P-sb53-bp-csi4]
    consequences: [A-sb53-bp-report]
    slots:
      - key: limbs
        slot: limbs (any of four)
        words: '"Critical safety incident" means any of the following'
        test:
          any:
            - label: "(1) weights accessed, modified or exfiltrated without authorization, resulting in death or bodily injury"
              all:
                - {fact: weights_compromised_unauthorized}
                - {fact: model_is_frontier}
                - {cmp: [{sum: [deaths, bodily_injuries]}, ">", 0]}
                - {fact: harm_resulted_from_weights_compromise}
            - label: "(2) harm resulting from the materialization of a catastrophic risk"
              ambiguous: R-materialization-partial
              candidates:
                full-outcome: {frame: F-sb53-bp-cr}
                partial-counts: {any: [{frame: F-sb53-bp-cr}, {fact: occurrence_realizes_ex_ante_catastrophic_risk_below_bar}]}
            - label: "(3) loss of control of a frontier model causing death or bodily injury"
              all:
                - {fact: loss_of_control}
                - {fact: model_is_frontier}
                - {cmp: [{sum: [deaths, bodily_injuries]}, ">", 0]}
                - {fact: harm_caused_by_loss_of_control}
            - label: "(4) deceptive subversion of the developer's controls outside an evaluation, 'in a manner that demonstrates materially increased catastrophic risk' (no harm required)"
              all:
                - {fact: deceptive_subversion_outside_evaluation}
                - {fact: occurrence_demonstrates_materially_increased_catastrophic_risk, slot: thin:risk-increase-evidenced}

  # ================================================================ SB 53 Labor Code
  - id: F-sb53-lab-cr
    row: T-sb53-lab-cr
    inherit: F-sb53-bp-cr
    passages: [P-sb53-lab-cr, P-sb53-lab-cr-excl-c, P-sb53-lab-fd-import]
    override:
      - key: bearer
        slot: thin:conduct-bearer
        words: "a frontier developer's development, storage, use, or deployment of a foundation model"
        test: {all: [{fact: developer_is_frontier_developer}, {fact: model_is_foundation}]}
      - key: model-conduct
        slot: thin:model-conduct-condition
        words: "involving a foundation model doing any of the following: (A) Providing expert-level assistance ... (B) Engaging in conduct with no meaningful human oversight ... if committed by a human ... (C) Evading the control of its frontier developer or user."
        resolution: R-control
        note: evaluated inside the bar slot, as in F-sb53-bp-cr
        test: {all: []}
      - key: exclusions
        slot: exclusions
        words: "does not include ... (A) Information ... otherwise publicly accessible ... (B) Lawful activity of the federal government. (C) Harm caused by a foundation model in combination with other software where the foundation model did not materially contribute"
        test: {not: {any: [{fact: excluded_public_info}, {fact: excluded_lawful_federal}, {fact: excluded_software_no_contribution}]}}

  - id: F-sb53-lab-csi
    row: T-sb53-lab-csi
    applies_to: occurrence
    concept: thin:event-status.conferred
    closure: closed
    in_force: {from: null}
    passages: [P-sb53-lab-csi, P-sb53-lab-csi4]
    slots:
      - key: limbs
        slot: limbs (any of four)
        words: '"Critical safety incident" means any of the following'
        test:
          any:
            - label: "(1) weights compromised, resulting in death, bodily injury, or damage to, or loss of, property"
              all:
                - {fact: weights_compromised_unauthorized}
                - {fact: model_is_foundation}
                - {any: [{cmp: [{sum: [deaths, bodily_injuries]}, ">", 0]}, {cmp: [property_loss_usd_excl_equity, ">", 0]}]}
                - {fact: harm_resulted_from_weights_compromise}
            - label: "(2) harm resulting from the materialization of a catastrophic risk (the Labor Code's own)"
              ambiguous: R-materialization-partial
              candidates:
                full-outcome: {frame: F-sb53-lab-cr}
                partial-counts: {any: [{frame: F-sb53-lab-cr}, {fact: occurrence_realizes_ex_ante_catastrophic_risk_below_bar}]}
            - label: "(3) loss of control of a foundation model causing death or bodily injury"
              all:
                - {fact: loss_of_control}
                - {fact: model_is_foundation}
                - {cmp: [{sum: [deaths, bodily_injuries]}, ">", 0]}
                - {fact: harm_caused_by_loss_of_control}
            - label: "(4) deceptive subversion outside an evaluation, 'in a manner that demonstrates materially increased catastrophic risk'"
              all:
                - {fact: deceptive_subversion_outside_evaluation}
                - {fact: occurrence_demonstrates_materially_increased_catastrophic_risk, slot: thin:risk-increase-evidenced}

  # ================================================================ RAISE
  - id: F-raise-cr
    row: T-raise-cr
    inherit: F-sb53-bp-cr
    in_force: {from: "2027-01-01", note: "S.8828 §3 as introduced (P-raise-effective); the enacted text was not read."}
    passages: [P-raise-cr, P-raise-cr-c, P-raise-person, P-raise-scope]
    override:
      - key: bearer
        slot: thin:conduct-bearer
        words: "a frontier developer's development, storage, use, or deployment of a frontier model"
        note: "Same words as SB 53; a different test, because RAISE binds 'person' as nongovernmental (§1420(14)) and SB 53's chapter does not bind it."
        resolution: R-raise-person
        test: {all: [{fact: developer_is_frontier_developer}, {fact: developer_is_nongovernmental}, {fact: model_is_frontier}]}
      - key: bar
        slot: thin:magnitude-bar
        words: "the death of, or serious injury to, more than fifty people or more than one billion dollars in damage to, or loss of, property arising from a single incident"
        resolution: [R-pooling, R-single-incident-attachment, R-incident]
      - key: coverage
        slot: territorial coverage (§1425)
        words: "only apply to frontier models that are developed, deployed, or operating in whole or in part in New York state"
        test: {fact: model_in_new_york_scope}

  - id: F-raise-csi
    row: T-raise-csi
    inherit: F-sb53-bp-csi
    in_force: {from: "2027-01-01"}
    passages: [P-raise-csi, P-raise-report]
    substitute_frames: {F-sb53-bp-cr: F-raise-cr}
    consequences: ["72-hour report to the office (P-raise-report), not SB 53's 15 days"]

  # ================================================================ xAI
  - id: F-xai25-cr
    row: T-xai25-cr
    applies_to: risk
    concept: thin:risk.possibility
    closure: "open at the document level: 'includes, but is not limited to' (P-xai25-scope)"
    in_force: {from: "2025-12-30", end: undetermined, note: "A same-titled xAI framework took effect 2026-06-30 without the bar, and its footnote 1 takes its terminology from the EU Code. Whether it replaces this one or sits beside it as the EU-facing framework is undetermined (L-xai-faif-revised-2026)."}
    passages: [P-xai25-scope, P-xai25-fn, P-xai25-date]
    slots:
      - key: incorporated
        slot: incorporation by reference (a mediated step)
        words: Catastrophic Risk as defined in the TFAIA
        resolution: R-xai25-incorporation
        test: {frame: F-sb53-bp-cr}

  - id: F-xairmf-cme
    row: T-xairmf-cme
    applies_to: occurrence
    concept: thin:occurrence
    closure: closed
    in_force: {from: "2025-08-20", end: undetermined, note: "Neither later xAI document says it replaces the RMF."}
    passages: [P-xairmf-bar, P-xairmf-date]
    slots:
      - key: bar
        slot: thin:magnitude-bar
        words: "more than one hundred deaths or over $1 billion in damages from weapons of mass destruction or cyberterrorist attacks on critical infrastructure"
        test:
          all:
            - {fact_in: [harm_mechanism, [weapon-of-mass-destruction, cyberterrorist-attack-on-critical-infrastructure]]}
            - any: [{cmp: [deaths, ">", 100]}, {cmp: [damages_usd, ">", 1000000000]}]

  # ================================================================ Anthropic FCF v2
  - id: F-fcf-systemic
    row: T-fcf-systemic
    applies_to: risk
    concept: thin:source-umbrella
    closure: open
    in_force: {from: "2026-07-24"}
    passages: [P-fcf-umbrella, P-fcf-tfaia-role, P-fcf-categories, P-fcf-date]
    slots:
      - key: members
        slot: umbrella members (any)
        words: 'references to "systemic" risks include both catastrophic risks under the TFAIA and systemic risks under the EU AI Act'
        resolution: R-fcf-umbrella
        test:
          ambiguous: R-fcf-umbrella
          candidates:
            open-the-sentence-adds:
              any:
                - {frame: F-sb53-bp-cr, label: "SB 53's catastrophic risk (P-fcf-umbrella)"}
                - {frame: F-eu-systemic, label: "the EU AI Act's systemic risk (P-act-3-65)"}
                - {frame: F-fcf-own, label: "the FCF's own sentence (P-fcf-def)"}
            exhaustive-the-sentence-summarizes:
              any:
                - {frame: F-sb53-bp-cr}
                - {frame: F-eu-systemic}

  - id: F-fcf-own
    row: T-fcf-systemic
    applies_to: risk
    concept: thin:risk.possibility
    closure: open              # "includes ... including but not limited to"
    in_force: {from: "2026-07-24"}
    passages: [P-fcf-def, P-fcf-our-models, P-fcf-categories, P-fcf-loc, P-fcf-manipulation]
    slots:
      - key: bearer
        slot: thin:conduct-bearer
        words: "systemic risks stemming from our models (§2.1's opening, not the definition sentence)"
        test: {fact: model_is_publishers_own}
      - key: model-conduct
        slot: thin:model-conduct-condition
        words: "the FCF currently addresses the following systemic risk categories: Cyber offense ... CBRN ... Harmful manipulation ... Loss of control, including evasion of oversight or unsupervised conduct, and autonomous behavior that would constitute serious crimes (such as assault, extortion, or theft) if committed by a human."
        note: SB 53's conduct list, moved out of the definition into a category list, opened ("such as") and without murder. Repaired after de-novo-feedback-1 §3.3.
        resolution: R-fcf-categories
        test:
          ambiguous: R-fcf-categories
          candidates:
            restrictive: {fact: risk_in_listed_category}
            illustrative: {all: []}
      - key: knowledge
        slot: thin:knowledge-standard
        words: foreseeable
        test: {fact: risk_foreseeable_at_conduct}
      - key: materiality
        slot: thin:materiality
        words: material
        test: {fact: risk_material}
      - key: contribution
        slot: thin:causal-contribution
        words: from
        test: {fact: harm_from_model}
      - key: coverage
        slot: thin:coverage.deictic
        words: "the most advanced (i.e. state-of-the-art) models at any given point in time"
        test: {fact: model_most_advanced_at_time}
      - key: bar
        slot: thin:magnitude-bar
        words: "large-scale harm ... including but not limited to >50 fatalities arising from a single incident, or 1 billion dollars of financial damages"
        also: [thin:bar-closure, thin:counting-unit, thin:harm.kind]
        resolution: [R-fcf-dollar-attachment, R-fcf-large-scale]
        test:
          any:
            - label: "the example (sufficient, not necessary)"
              ambiguous: R-fcf-dollar-attachment
              candidates:
                fatalities-only:
                  any:
                    - all: [{fact: single_incident}, {cmp: [deaths, ">", 50]}]
                    - {cmp: [financial_damages_usd, ">=", 1000000000]}
                attaches-to-both:
                  all:
                    - {fact: single_incident}
                    - any: [{cmp: [deaths, ">", 50]}, {cmp: [financial_damages_usd, ">=", 1000000000]}]
            - {fact: large_scale_harm, genus: true, label: "the genus, 'large-scale harm', unbound (R-fcf-large-scale)"}

  # ================================================================ EU AI Act (read for Art. 3(65) only)
  - id: F-eu-systemic
    row: T-eu-systemic
    applies_to: risk
    concept: thin:risk.possibility
    closure: closed
    in_force: {from: null, note: "application dates not read"}
    passages: [P-act-3-65]
    slots:
      - key: capability
        slot: capability condition
        words: a risk that is specific to the high-impact capabilities of general-purpose AI models
        test: {fact: risk_specific_to_high_impact_capabilities}
      - key: impact
        slot: impact condition
