# Translation: the sources' words in our (throwaway, thin:) terms.
#
# Two record kinds, both invented for G1b:
#
# 1. Translation rows (T-*), roughly the plan's §3.4 type-level row:
#      source_term, scope, binding (how the source term gets its meaning),
#      minted_at, intended_cardinality, ours, frame, skos, justification.
#    `binding` values, in address theory's terms (addr:, udon 90f4fb6):
#      bound          the source mints and maintains the name here (a definition)
#      imported       the source points to another scope's binding (a mediated step)
#      incorporated   a non-statutory source adopts another instrument's binding by reference
#      unbound        used undefined; the reader supplies the criteria
#    Note: a bound statutory term is a binding to a TEST. Its definiens reaches
#    risks, people or models by match (addr:match), as of a moment. So "bound
#    vs match" (plan §3.3) is two axes, not one (D-bound-vs-match).
#    `skos` uses the SKOS/SSSOM direction (subject = the source term), as plan
#    decision 2 recommends. Most rows have no single SKOS target: a definition
#    translates to a frame, not a term (D-row-vs-frame).
#
# 2. Definition frames (F-*): a source definition as one of our concepts plus
#    slots, one per separable clause. Each slot keeps the source's words, names
#    the resolution record that settles them (or doesn't), and carries a `test`
#    that tools/answer.py evaluates against a scenario. Test vocabulary:
#      {fact: NAME}                          a scenario fact: true / false / unknown
#      {fact_in: [NAME, [values]]}           an enumerated fact is one of the values
#      {cmp: [EXPR, OP, N]}                  EXPR is a fact or {sum: [facts]}; facts
#                                            may be intervals, so unknowns propagate
#      {all: [...]}, {any: [...]}, {not: T}  three-valued (Kleene) logic
#      {frame: F-ID}                         another frame's result
#      {ambiguous: R-ID, candidates: {name: T, ...}}
#                                            evaluated under every candidate; the
#                                            answer reports whether the choice mattered
#    Frames may `inherit` another frame and `override` slots by key: the two
#    SB 53 codes, RAISE, and the lineage drift all need it (D-frame-inheritance).
#
# Everything here is a first pass by one agent (Claude Opus 5.5, 2026-10-07),
# unreviewed. justification: ManualMappingCuration would be wrong: in SSSOM's
# terms this is AgentBasedMatching, awaiting a reviewer.

author: Claude (Opus 5.5), thin pass, 2026-10-07; unreviewed
read_as_of: 2026-10-07   # thin:read-as-of: relata PDFs as of this date, extracted with poppler pdftotext -layout

rows:
  # ------------------------------------------------------------ SB 53
  - id: T-sb53-bp-cr
    source_term: catastrophic risk
    scope: S-sb53-bp
    binding: bound
    minted_at: P-sb53-bp-cr
    intended_cardinality: "{0,N}: a class of risks"
    ours: thin:risk.possibility
    frame: F-sb53-bp-cr
    skos: "none fits: the term is a narrowing of thin:risk.possibility by eight clauses; SSSOM's subject-predicate-object row can't carry them"
    justification: The definition's head is "a ... risk that [conduct] will [contribute to harm]", which is the possibility reading; no probability, expectation or frequency appears (but see R-material).
  - id: T-sb53-lab-cr
    source_term: catastrophic risk
    scope: S-sb53-lab
    binding: bound
    minted_at: P-sb53-lab-cr
    intended_cardinality: "{0,N}"
    ours: thin:risk.possibility
    frame: F-sb53-lab-cr
    skos: none fits (as T-sb53-bp-cr)
    justification: "A second mint of the same name by the same legislature, in a different scope. In address theory that is two bindings, not a collision (addr:scope: 'two mints of one name in different scopes are simply two bindings')."
  - id: T-sb53-bp-csi
    source_term: critical safety incident
    scope: S-sb53-bp
    binding: bound
    minted_at: P-sb53-bp-csi
    intended_cardinality: "{0,N}: a class of occurrences"
    ours: thin:event-status.conferred
    frame: F-sb53-bp-csi
    skos: none fits
    justification: Four disjoint limbs, each a condition on an occurrence. The status triggers duties (P-sb53-bp-report, P-sb53-bp-report24), which is what makes it a conferred status and not a kind of event.
  - id: T-sb53-lab-csi
    source_term: critical safety incident
    scope: S-sb53-lab
    binding: bound
    minted_at: P-sb53-lab-csi
    intended_cardinality: "{0,N}"
    ours: thin:event-status.conferred
    frame: F-sb53-lab-csi
    skos: none fits
    justification: Differs from T-sb53-bp-csi in limb (1) (adds property) and in model class (foundation, not frontier).
  - id: T-sb53-fd
    source_term: frontier developer
    scope: S-sb53-bp
    binding: bound
    minted_at: P-sb53-bp-fd
    intended_cardinality: "{0,N} persons"
    ours: "no thin: term: an institutional role (plan §3.9), G2's work. Q1 uses it only as a condition (thin:conduct-bearer)."
    skos: noTermFound
    justification: "Imported into S-sb53-lab by §1107(e) (P-sb53-lab-fd-import), a mediated step in address theory's sense."
  - id: T-sb53-fm
    source_term: frontier model
    scope: S-sb53-bp
    binding: bound
    minted_at: P-sb53-bp-fm
    intended_cardinality: "{0,N} models"
    ours: "no thin: term: a model classed by a compute test. Q1 uses it only as a condition."
    skos: noTermFound
    justification: "Its test (>10^26 operations, cumulative over modifications) is a match run as of a moment. §22757.14 asks for annual review of whether the test still reaches 'foundation models at the frontier' (P-sb53-bp-review): a match failing through the world's motion, or a dangle, depending on what the binding is taken to bind (D-bound-vs-match)."
  - id: T-sb53-property
    source_term: property
    scope: S-sb53-bp
    binding: bound
    minted_at: P-sb53-bp-property
    intended_cardinality: "{0,N}"
    ours: thin:harm.kind
    skos: "none: our harm kinds are the sources' words, unmerged"
    justification: "'Tangible or intangible', narrowed for this chapter by §22757.16, which excludes loss of equity value (P-sb53-bp-equity); the Labor Code repeats the exclusion for its chapter."
  - id: T-sb53-incident
    source_term: incident (in "a single incident")
    scope: S-sb53-bp
    binding: unbound
    intended_cardinality: "{1,1} per counting"
    ours: thin:counting-unit
    skos: noTermFound
    justification: "SB 53 defines 'critical safety incident' but not 'incident'. See R-incident."
  - id: T-sb53-severity
    source_term: severity (of the violation)
    scope: S-sb53-bp
    binding: unbound
    minted_at: P-sb53-bp-severity
    ours: "none on the risk side: it grades violations for the penalty, not harms"
    skos: noTermFound
    justification: SB 53's only "severity". The statute uses neither "severe" nor "systemic" of harm or risk (searched in the extraction).
  - id: T-sb53-findings-cr
    source_term: catastrophic risk (in the findings)
    scope: S-sb53-uncodified
    binding: unbound
    minted_at: P-sb53-findings-n
    ours: thin:risk.possibility
    skos: none
    justification: "The findings sit outside both chapters, and each chapter's definition is 'For purposes of this chapter'. So the findings' uses resolve to neither definition by walking (R-findings-cr). Not needed for Q1; recorded because it is the cleanest origin-relative case in the slice."

  # ------------------------------------------------------------ RAISE
  - id: T-raise-cr
    source_term: Catastrophic risk
    scope: S-raise-gbl-44b
    binding: bound
    minted_at: P-raise-cr
    intended_cardinality: "{0,N}"
    ours: thin:risk.possibility
