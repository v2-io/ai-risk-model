    - 'https://openai.com/policies/terms-of-use/ (Effective: January 1, 2026), via Wayback capture 20261010035531 because
      openai.com returns 403 to non-browser clients'
    confidence: high (no licence stated in documents); medium (site terms)
    notes: The Terms of Use govern the Services (ChatGPT, API) and Input/Output ownership; they contain no clause permitting
