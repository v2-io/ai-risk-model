# Licences and terms of the catalog's sources: what each one permits a public repository to do with its text.
#
# Compiled 2026-10-10 as a preparatory step for deciding which sources' verbatim text may be committed (for
# example cut into one file per citable unit) and which may only be quoted. catalog/licences.md summarises it
# and says where it is uncertain. This is a record of what the sources and publishers say, and of general rules
# applied where they say nothing; it is not legal advice.
#
# One entry per key in source-catalog.md (bin/corpus.py read_catalog()), in catalog order, under `sources:`.
# Fields of an entry:
#   catalog_status   active, or superseded-by / subsumed-by KEY, and no-canon, as the catalog tags it (copied for
#                    convenience; the catalog is authoritative).
#   licence          an id defined under `licences:` below. none-found = nothing found, so default copyright;
#                    all-rights-reserved = an explicit reservation was found; custom / mixed / conflict = see the entry.
#   licence_detail   the finder's fuller label, where the id simplifies it.
#   stated           where the licence comes from: document (the document itself), publisher (the publisher's page
#                    or site terms), record (the arXiv or Crossref record), or no (nothing found; a general rule was
#                    applied, or the licence is unknown). A disposition rule that wants only found licences gates on it.
#   republish_full   whether the whole verbatim text may be committed: yes | conditional (only if a condition beyond
#                    attribution is met: non-commercial use, unmodified text, carried notices) | no | unknown.
#   quote_at_length  long verbatim passages: same values. "no" means nothing grants it; copyright exceptions may still.
#   quote_briefly    yes (the terms grant it) | conditional | exception (no grant; rests on fair use or a quotation
#                    exception, which is a general rule, not a finding about the source).
#   attribution, conditions, derivatives   what the terms require, as the finder recorded them.
#   confidence       high | medium | low, with confidence_note where the finder qualified it.
#   basis            how the finding was reached, in the finder's words.
#   policy           ids under `policies:` whose verbatim evidence covers this key (one statement, many keys).
#   evidence         the licence statement quoted verbatim, or what was looked at and not found.
#   where            the document page (ref/canonical/KEY.md pdf-page N = physical PDF page) or URL, with fetch date.
#   held_copy        for papers: whether the PDF we hold is the version the licence attaches to.
#   conflict         two statements that disagree; republish_full is not "yes" while one stands.
#   notes            anything else, including problems with the held copy or the catalog entry.
#   family           which part of the survey produced it: paper (arXiv and journal records, checked by the
#                    coordinating session), org, gov-uk-us, gov-world (each checked by its own agent).
# The working files behind each family (scripts, downloaded pages) were in a session scratch directory and are
# not kept; the evidence quoted here is what remains.

checked: '2026-10-10'
licences:
  CC0-1.0:
    name: Creative Commons CC0 1.0 Universal (public-domain dedication)
    url: https://creativecommons.org/publicdomain/zero/1.0/
    republish_full: 'yes'
    quote_at_length: 'yes'
    quote_briefly: 'yes'
    attribution: not-required
    conditions: none; citing the source is still good practice
  CC-BY-4.0:
    name: Creative Commons Attribution 4.0 International
    url: https://creativecommons.org/licenses/by/4.0/
    republish_full: 'yes'
    quote_at_length: 'yes'
    quote_briefly: 'yes'
    attribution: required
    conditions: credit the creator, link the licence, indicate changes; §2(a)(1)(A) allows sharing "in whole or in part"
  CC-BY-SA-4.0:
    name: Creative Commons Attribution-ShareAlike 4.0 International
    url: https://creativecommons.org/licenses/by-sa/4.0/
    republish_full: 'yes'
    quote_at_length: 'yes'
    quote_briefly: 'yes'
    attribution: required
    conditions: as CC BY; adapted material must be shared under the same or a compatible licence
  CC-BY-NC-4.0:
    name: Creative Commons Attribution-NonCommercial 4.0 International
    url: https://creativecommons.org/licenses/by-nc/4.0/
    republish_full: conditional
    quote_at_length: conditional
    quote_briefly: 'yes'
    attribution: required
    conditions: non-commercial purposes only; whether this project's use is non-commercial is a judgment for Joseph
  CC-BY-NC-SA-4.0:
    name: Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International
    url: https://creativecommons.org/licenses/by-nc-sa/4.0/
    republish_full: conditional
    quote_at_length: conditional
    quote_briefly: 'yes'
    attribution: required
    conditions: non-commercial purposes only; adapted material under the same licence
  CC-BY-NC-ND-4.0:
    name: Creative Commons Attribution-NonCommercial-NoDerivatives 4.0 International
    url: https://creativecommons.org/licenses/by-nc-nd/4.0/
    republish_full: conditional
    quote_at_length: conditional
    quote_briefly: 'yes'
    attribution: required
    conditions: non-commercial purposes only; verbatim only, though §2(a)(1)(A) allows sharing "in whole or in part"; adapted
      material may not be shared
  OGL-UK-3.0:
    name: UK Open Government Licence v3.0
    url: https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/
    republish_full: 'yes'
    quote_at_length: 'yes'
    quote_briefly: 'yes'
    attribution: required
    conditions: acknowledge the source and link the licence where possible; does not cover third-party rights, personal
      data, logos and crests, or other material excluded "where otherwise stated"
  US-federal-public-domain:
    name: Work of the US Government, not subject to US copyright (17 U.S.C. §105)
    url: https://www.law.cornell.edu/uscode/text/17/105
    republish_full: 'yes'
    quote_at_length: 'yes'
    quote_briefly: 'yes'
    attribution: not-required
    conditions: third-party material inside the work may still be copyrighted; §105 is a US rule, and copyright may be asserted
      abroad
  arXiv-nonexclusive-1.0:
    name: arXiv.org perpetual, non-exclusive license to distribute 1.0
    url: http://arxiv.org/licenses/nonexclusive-distrib/1.0/
    republish_full: 'no'
    quote_at_length: 'no'
    quote_briefly: exception
    attribution: required
    conditions: grants arXiv alone the right to distribute; grants nothing to anyone else, so for us the work is under ordinary
      copyright
  all-rights-reserved:
    name: Ordinary copyright, no reuse licence found or granted
    url: null
    republish_full: 'no'
    quote_at_length: 'no'
    quote_briefly: exception
    attribution: required
    conditions: only what copyright exceptions allow (fair use in the US; quotation and criticism-or-review fair dealing
      in the UK; the quotation exception in the EU)
  unknown:
    name: Not determined
    url: null
    republish_full: unknown
    quote_at_length: unknown
    quote_briefly: exception
    attribution: required
    conditions: treat as all-rights-reserved until determined
  none-found:
    name: No licence or reuse statement found; ordinary copyright applies by default
    url: null
    republish_full: 'no'
    quote_at_length: 'no'
    quote_briefly: exception
    attribution: required
    conditions: same consequences as all-rights-reserved, but nothing was found saying so; a site-wide grant somewhere unchecked
      would change it
  US-state-edict-public-domain:
    name: State statute or bill text, outside copyright under the government-edicts doctrine (Georgia v. Public.Resource.Org,
      590 U.S. 255 (2020))
    url: https://supreme.justia.com/cases/federal/us/590/18-1150/
    republish_full: 'yes'
    quote_at_length: 'yes'
    quote_briefly: 'yes'
    attribution: not-required
    conditions: applied as a general rule; covers text the legislature or its officials author in their official capacity
  public-domain:
    name: Outside copyright for a stated reason (see the entry's licence_detail)
    url: null
    republish_full: 'yes'
    quote_at_length: 'yes'
    quote_briefly: 'yes'
    attribution: not-required
    conditions: see the entry
  EU-reuse-2011-833:
    name: EU reuse rules for Commission documents, Decision 2011/833/EU (EUR-Lex legal notice)
    url: https://eur-lex.europa.eu/eli/dec/2011/833/oj
    republish_full: 'yes'
    quote_at_length: 'yes'
    quote_briefly: 'yes'
    attribution: required
    conditions: acknowledge the source; do not distort the original meaning or message; only the Official Journal text is
      authentic
  OECD-terms-pre-2024-07:
    name: OECD Terms and Conditions, section for content published before 1 July 2024
    url: https://www.oecd.org/en/about/terms-conditions.html
    republish_full: 'yes'
    quote_at_length: 'yes'
    quote_briefly: 'yes'
    attribution: required
    conditions: cite the original work; an adaptation must carry the OECD's adaptation disclaimer and not use its logo,
      visual identity or cover image
  Japan-PDL-1.0:
    name: Public Data License 1.0 (Government of Japan), applied by MOFA's site terms
    url: https://www.digital.go.jp/resources/open_data/public_data_license_v1.0
    republish_full: 'yes'
    quote_at_length: 'yes'
    quote_briefly: 'yes'
    attribution: required
    conditions: cite the source; an edited version must say it was edited and must not appear to be MOFA's own
  ISED-terms:
    name: Innovation, Science and Economic Development Canada, Terms and conditions (non-commercial reproduction)
    url: https://ised-isde.canada.ca/site/ised/en/terms-and-conditions
    republish_full: conditional
    quote_at_length: conditional
    quote_briefly: 'yes'
    attribution: required
    conditions: non-commercial reproduction "in whole or in part"; indicate the source; not presented as an official version
      or as endorsed
  IETF-TLP-5.0:
    name: IETF Trust Legal Provisions 5.0 (applies to RFCs)
    url: https://trustee.ietf.org/assets/trust-legal-provisions/
    republish_full: conditional
    quote_at_length: conditional
    quote_briefly: 'yes'
    attribution: required
    conditions: reproduce unmodified, with the IETF legends; no licence to modify outside the IETF process (TLP 3.d.i);
      code components are BSD-licensed
  W3C-document-licence:
    name: W3C Document License
    url: https://www.w3.org/copyright/document-license-2023/
    republish_full: conditional
    quote_at_length: conditional
    quote_briefly: 'yes'
    attribution: required
    conditions: copy and distribute in whole or in part with a link to the original, the copyright notice and the document's
      status; no modifications or derivatives
  custom:
    name: The publisher's own terms (see the entry and its policy)
    url: null
    republish_full: see entry
    quote_at_length: see entry
    quote_briefly: see entry
    attribution: see entry
    conditions: see entry
  mixed:
    name: Parts under different regimes (for example a joint work of two governments)
    url: null
    republish_full: see entry
    quote_at_length: see entry
    quote_briefly: see entry
    attribution: see entry
    conditions: see entry
  conflict:
    name: Two statements disagree, and the entry does not resolve them
    url: null
    republish_full: see entry
    quote_at_length: see entry
    quote_briefly: see entry
    attribution: see entry
    conditions: see entry
policies:
  org/none-found-default:
    meaning: 'No licence or reuse statement found in the document or on the publisher pages checked. Applied general rule:
      under default copyright (Berne; US 17 USC 106) the absence of a licence grants no permission to reproduce or republish;
      brief quotation then rests only on statutory exceptions (US fair use, 17 USC 107; UK CDPA s.30(1ZA) quotation; etc.).'
    basis: general-rule
  org/anthropic-site:
    licence: none-found
    republish_full: 'no'
    quote_at_length: no-grant
    quote_briefly: exceptions-only
    attribution: n/a (no grant)
    conditions: []
    basis:
    - document
    - publisher-page
    - general-rule
    evidence:
    - © 2026 Anthropic PBC
    - These Terms of Service ("Terms") govern your use of Claude.ai, Claude Pro, and other products and services that we
      may offer for individuals, along with any associated apps, software, and websites (together, our "Services").
    where:
    - footer of anthropic.com pages (e.g. canonical anthropic-2025-fcf-announcement p8; https://www.anthropic.com/responsible-scaling-policy
      fetched 2026-10-10)
    - https://www.anthropic.com/legal/consumer-terms (Effective October 8, 2025), fetched 2026-10-10
    confidence: high (that no licence is stated); medium (that no site-wide grant exists elsewhere)
    notes: The site footer links only to product terms (commercial, consumer, K-12) and the usage policy; the consumer terms
      cover Inputs/Outputs ("Materials") and say nothing permitting reuse of Anthropic's own published documents. No licence
      line in the text layer of any Anthropic PDF in this family (front/back pages grepped and read). The constitution is
      the one Anthropic exception (CC0).
